name: azsdk-common-sdk-breaking-change-eval
description: tests for the azsdk-common-sdk-breaking-change skill
type: capability

environment: azsdk-mcp

tags:
  area: azsdk-common-sdk-breaking-change
  type: ci-gate

defaults:
  runs: 1
  timeout: "900s"
  model: gpt-5.6-sol
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: detect-sdk-breaking-changes-for-service-001
    prompt: "Detect and mitigate Go SDK breaking changes for the service webpubsub"
    environment:
      commands:
        - git clone --filter=blob:none --sparse https://github.com/Azure/azure-sdk-for-go.git && cd azure-sdk-for-go && git sparse-checkout set eng documentation sdk/resourcemanager/webpubsub/armwebpubsub
        - git clone --filter=blob:none --sparse https://github.com/Azure/azure-rest-api-specs.git && cd azure-rest-api-specs && git sparse-checkout set specification/webpubsub/resource-manager/Microsoft.SignalRService/SignalRService
        - node -e "require('fs').copyFileSync('models.tsp', 'azure-rest-api-specs/specification/webpubsub/resource-manager/Microsoft.SignalRService/SignalRService/models.tsp')"
      files:
        - src: ../fixtures/detect-sdk-breaking-changes-for-service-001/models.tsp
          dest: models.tsp
    graders:
      - type: skill-invocation
        config:
          required:
            [
              "azsdk-common-sdk-breaking-change",
              "azsdk-common-generate-sdk-locally",
            ]
      - type: tool-calls
        config:
          required: ["azure-sdk-mcp-azsdk_package_detect_breaking_change"]

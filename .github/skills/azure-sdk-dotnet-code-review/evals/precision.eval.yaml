name: azure-sdk-dotnet-code-review-precision-eval
description: Initial precision checks for open-ended findings, deterministic repository rules, and false-positive suppression.

type: capability

environment:
  skills:
    - ".."

tags:
  area: code-review
  type: precision

defaults:
  runs: 1
  timeout: "90s"
  model: gpt-6-astra
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: retain-open-ended-bug-review
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Then use it to review this synthetic
      changed line and return findings only:
      `for (int i = 0; i <= items.Count; i++) total += items[i];`
      The surrounding method is otherwise correct.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?i)IndexOutOfRangeException|ArgumentOutOfRangeException|one past'

  - name: report-test-project-suppression
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Then use it to review this synthetic
      Azure SDK test-project diff and return findings only:
      `<NoWarn>$(NoWarn);CA2000</NoWarn>` was added to the test csproj.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-contains
        config:
          substring: "CA2000"
      - type: output-contains
        config:
          substring: "suppression"

  - name: allow-prerelease-dependency-in-prerelease-library
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Then use it to review this synthetic
      csproj diff and return findings only. The package version is `1.0.0-beta.2` and it adds a
      PackageReference that resolves to `2.0.0-beta.1`. There are no other changes. If there is no
      finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: ignore-unrelated-unchanged-code
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Then use it to review this synthetic PR
      and return findings only. The only changed line fixes a spelling error in README.md. An
      unchanged source file elsewhere has a public `DateTime StartTime` property. Do not review
      unchanged code. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: do-not-repeat-normal-ci-diagnostic
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Then use it to review this synthetic PR
      and return findings only. CI already reports AZC0015 for a changed client constructor. The PR
      adds no suppression, opt-out, baseline, or allow-list entry. If there is no finding, return
      exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: report-analyzer-opt-out
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Then use it to review this synthetic
      csproj diff and return findings only:
      `<DisableEnhancedAnalysis>true</DisableEnhancedAnalysis>` was added.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-contains
        config:
          substring: "DisableEnhancedAnalysis"
      - type: output-contains
        config:
          substring: "suppression"

  - name: report-missing-client-settings-schema
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Then use it to review this synthetic
      hand-written client-library diff and return findings only. It adds a public
      `WidgetClientSettings` type for appsettings configuration but adds no ConfigurationSchema.json
      file.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-contains
        config:
          substring: "ConfigurationSchema.json"

  - name: allow-preview-only-member-rename-on-ga-type
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets 1.0.0 shipped WidgetClient.GetWidget in GA. GetWidgetSummary
      and its async counterpart first appeared on that same client in 1.1.0-beta.1 and have never
      appeared in a GA release. The 1.1.0-beta.2 PR renames only those preview methods to
      GetWidgetDetails and GetWidgetDetailsAsync, including their API-listing entries.
      Every GA API and its behavior remain unchanged. All other API design, implementation,
      documentation, testing, changelog, and generation requirements are satisfied. No CI
      diagnostic covers these changes. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: protect-ga-member-in-mixed-preview-diff
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR.
      Azure.Widgets 1.0.0 shipped WidgetClient.GetWidget in GA. On the same type,
      GetWidgetDetails appeared only in 1.1.0-beta.1 and never shipped GA. The 1.1.0-beta.2 PR
      removes both methods and their async counterparts, with no replacements. The released
      1.0.0 assembly confirms these histories; existing GA callers of GetWidget no longer compile.
      All other requirements are satisfied, and no CI diagnostic covers the changes.
      Return findings only as a JSON object with a findings array. Each finding must have
      symbol, reason, and recommendation strings; use the sync method name for a sync/async pair.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '"symbol"\s*:\s*"GetWidget"'
      - type: output-not-matches
        config:
          pattern: '"symbol"\s*:\s*"GetWidgetDetails"'

  - name: allow-never-shipped-api-change-in-stable-candidate
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets has GA releases through 1.0.0. A new WidgetClient.GetWidgetDetails
      method was checked into main and its API listing after 1.0.0, but has never been published in
      any package. The current PR removes that method and its async counterpart while preparing
      1.1.0, whose project version is already stable but which has not been released. Every GA
      contract remains unchanged. All other design, implementation, documentation, testing,
      changelog, and generation requirements are satisfied. No CI diagnostic covers these changes.
      If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: allow-listing-change-that-restores-ga-contract
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets explicitly uses ApiCompatVersion 1.0.0, and that released GA
      assembly exposes GetWidget(string widgetName). A previous beta mistakenly changed this to
      GetWidget(string name). The current PR changes the parameter back to widgetName everywhere,
      including sync/async methods and API listings, restoring the exact GA signature and named
      argument behavior. The name parameter existed only in that beta. This PR introduces no
      other incompatibility, suppression, opt-out, or independent rule violation. No CI diagnostic
      covers the change. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: do-not-invent-ga-history-from-api-listing
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. A WidgetClient method and its async counterpart are renamed consistently
      in source and checked-in API listings. The new names and all other changes satisfy the
      applicable rules. The package has prior GA releases, but the supplied evidence does not
      establish whether these particular methods were in any of them. Released assemblies,
      release tags, and prior baseline metadata are unavailable for this fictional fixture.
      There is no other evidence of a GA consumer incompatibility and no CI diagnostic.
      If no finding is supported, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: allow-preview-only-contract-reshaping
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets has shipped GA, but WidgetClientOptions.DetailedOutput and
      the matching appsettings key DetailedOutput appeared only in 1.1.0-beta.1. The current PR
      renames both to IncludeDetails and consistently updates the configuration schema, defaults,
      serialization, samples, and tests. No GA release included this option or key; all GA
      behavior and configuration remain unchanged. The new contract and every other aspect of
      the PR satisfy applicable rules. No CI diagnostic covers these changes. If there is no
      finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: protect-ga-configuration-contract-in-preview-candidate
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets 1.0.0 GA documented and supported the appsettings key Endpoint.
      In 1.1.0-beta.1 the PR changes the binder and schema to accept only ServiceEndpoint, so
      existing GA applications using Endpoint can no longer configure the client. Public C#
      signatures and API listings are unchanged. All other design, implementation, documentation,
      testing, and packaging requirements are satisfied. No CI diagnostic covers the change.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-contains
        config:
          substring: "Endpoint"
      - type: output-matches
        config:
          pattern: '(?i)compatib|break|existing'
      - type: output-not-matches
        config:
          pattern: '(?m)^No findings\.$'

  - name: review-never-shipped-api-for-independent-design-violations
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets 1.1.0-beta.1 adds new public service operations GetWidgetDetails
      and GetWidgetDetailsAsync on WidgetClient. Neither has ever shipped. Both methods are
      non-virtual, preventing mocked clients from overriding them. Their implementations,
      signatures, cancellation, documentation, tests, and API listings otherwise satisfy all
      requirements, and no GA contract is affected. No CI diagnostic covers the omission.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?i)virtual|mock'
      - type: output-not-matches
        config:
          pattern: '(?m)^No findings\.$'

  - name: detect-additive-change-that-breaks-ga-callers
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets 1.0.0 GA exposes GetWidget(string widgetName), and
      client.GetWidget(null) compiles against that release. The 1.1.0-beta.1 PR adds
      GetWidget(Uri widgetUri) alongside the unchanged string overload. The same GA caller
      now fails to compile because null is ambiguous between the two overloads. The async
      counterparts, documentation, tests, API listings, and all other requirements are satisfied.
      No CI diagnostic covers this source-compatibility failure.
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?i)ambig|overload resolution'
      - type: output-not-matches
        config:
          pattern: '(?m)^No findings\.$'

  - name: allow-experimental-api-change-in-ga-package
    prompt: >-
      First invoke the azure-sdk-dotnet-code-review skill. Review this synthetic PR and return
      findings only. Azure.Widgets 1.0.0 is a GA package. WidgetClient.GetWidget is a GA API,
      but GetWidgetDetails and its async counterpart were marked Experimental from their first
      release and explicitly documented as unsupported preview contracts. Those two methods are
      present in the released 1.0.0 assembly, but have never been offered as GA APIs.
      The 1.1.0 PR removes only those experimental methods. GetWidget and every other GA
      contract remain unchanged. All other applicable requirements are satisfied, and no CI
      diagnostic covers these changes. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["azure-sdk-dotnet-code-review"]
      - type: output-matches
        config:
          pattern: '(?m)^No findings\.$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

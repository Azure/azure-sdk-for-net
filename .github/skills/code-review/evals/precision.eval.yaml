      Every GA API and its behavior remain unchanged. All other API design, implementation,
      documentation, testing, changelog, and generation requirements are satisfied. No CI
      diagnostic covers these changes. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '^\s*No findings\.\s*$'
      - type: output-not-matches

      - type: output-not-matches
        config:
          pattern: '^\s*No findings\.\s*$'
      - type: output-matches
        config:
          pattern: '(?i)((?:DisableEnhancedAnalysis)[^\n]*(🔴|🟡|ℹ️)|(🔴|🟡|ℹ️)[^\n]*(?:DisableEnhancedAnalysis))'
      - type: output-matches
        config:
          pattern: '(?i)((?:suppression)[^\n]*(🔴|🟡|ℹ️)|(🔴|🟡|ℹ️)[^\n]*(?:suppression))'


  - name: review-consequence-of-dependency-version-bump
    prompt: >-
      First invoke the code-review skill. Review this synthetic PR and return
      findings only. The PR's only change bumps the long-approved dependency
      `Microsoft.Azure.Widgets.Protocol` from `3.4.2` to `4.0.0`, its latest stable release, in

          pattern: '(?i)((?:ConfigurationSchema\.json)[^\n]*(🔴|🟡|ℹ️)|(🔴|🟡|ℹ️)[^\n]*(?:ConfigurationSchema\.json))'

  - name: allow-preview-only-member-rename-on-ga-type

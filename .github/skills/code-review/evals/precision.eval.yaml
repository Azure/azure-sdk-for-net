name: code-review-precision-eval
description: Initial precision checks for open-ended findings, deterministic repository rules, and false-positive suppression.

type: capability

environment:
  skills:
    - ".."

tags:
  area: code-review
  type: precision

defaults:
  runs: 1
  timeout: "90s"
  model: gpt-6.1-sol
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: retain-open-ended-bug-review
    prompt: >-
      First invoke the code-review skill. Then use it to review this synthetic
      changed line and return findings only:
      `for (int i = 0; i <= items.Count; i++) total += items[i];`
      The surrounding method is otherwise correct.
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '(?i)IndexOutOfRangeException|ArgumentOutOfRangeException|one past'
      - type: output-not-matches
        config:
          pattern: '^\s*No findings\.\s*$'
      - type: output-matches
        config:
          pattern: '(?i)((?:IndexOutOfRangeException|ArgumentOutOfRangeException|one past)[^\n]*(🔴|🟡|ℹ️)|(🔴|🟡|ℹ️)[^\n]*(?:IndexOutOfRangeException|ArgumentOutOfRangeException|one past))'

  - name: report-test-project-suppression
    prompt: >-
      First invoke the code-review skill. Then use it to review this synthetic
      Azure SDK test-project diff and return findings only:
      `<NoWarn>$(NoWarn);CA2000</NoWarn>` was added to the test csproj.
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-contains
        config:
          substring: "CA2000"
      - type: output-contains
        config:
          substring: "suppression"
      - type: output-not-matches
        config:
          pattern: '^\s*No findings\.\s*$'
      - type: output-matches
        config:
          pattern: '(?i)((?:CA2000)[^\n]*(🔴|🟡|ℹ️)|(🔴|🟡|ℹ️)[^\n]*(?:CA2000))'
      - type: output-matches
        config:
          pattern: '(?i)((?:suppression)[^\n]*(🔴|🟡|ℹ️)|(🔴|🟡|ℹ️)[^\n]*(?:suppression))'

  - name: allow-prerelease-dependency-in-prerelease-library
    prompt: >-
      First invoke the code-review skill. Then use it to review this synthetic
      csproj diff and return findings only. The package version is `1.0.0-beta.2` and it adds a
      PackageReference that resolves to `2.0.0-beta.1`. There are no other changes. If there is no
      finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '^\s*No findings\.\s*$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'

  - name: allow-privateassets-build-tooling-prerelease-on-ga-flip
    prompt: >-
      First invoke the code-review skill. Then use it to review this synthetic
      csproj diff and return findings only. A shipping library's `<Version>` changes from
      `1.0.0-beta.3` to `1.0.0`. Its only package references are a shipped dependency already
      pinned to a stable version, plus build-time-only tooling — `Microsoft.Azure.AutoRest.CSharp`
      and `Azure.ClientSdk.Analyzers` — each centrally versioned to a prerelease and marked
      `PrivateAssets="All"`, so neither appears in the published dependency list. There are no
      other changes. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '^\s*No findings\.\s*$'

  - name: same-type-different-concept-parameters-are-not-flagged
    prompt: >-
      First invoke the code-review skill. Then use it to review this synthetic new
      public API and return findings only. A new method adds the signature
      `GetOperationStatus(string widgetName, string operationId, CancellationToken
      cancellationToken = default)`. Both `widgetName` and `operationId` are type `string`, but
      they name different concepts — a widget's name and an operation's identifier — and each
      name is already used consistently for that same concept elsewhere in the client. There is
      no other naming inconsistency. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '^\s*No findings\.\s*$'

  - name: flag-missing-cancellationtoken-on-scm-stack-convenience-method
    prompt: >-
      First invoke the code-review skill. Then use it to review this synthetic new
      public API and return findings only. The library is on the `System.ClientModel` stack. A new
      convenience method adds the signature `public virtual Task<ClientResult<Widget>>
      GetWidgetAsync(string widgetName)` — it takes no `CancellationToken` parameter at all, and
      no protocol-method overload with a trailing `RequestOptions` parameter exists either.
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '(?i)CancellationToken'
      - type: output-not-matches
        config:
          pattern: '^\s*No findings\.\s*$'
      - type: output-matches
        config:
          pattern: '(?i)((?:CancellationToken)[^\n]*(🔴|🟡|ℹ️)|(🔴|🟡|ℹ️)[^\n]*(?:CancellationToken))'

  - name: ignore-unrelated-unchanged-code
    prompt: >-
      First invoke the code-review skill. Then use it to review this synthetic PR
      and return findings only. The only changed line fixes a spelling error in README.md. An
      unchanged source file elsewhere has a public `DateTime StartTime` property. Do not review
      unchanged code. If there is no finding, return exactly `No findings.`
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '^\s*No findings\.\s*$'
      - type: output-not-matches
        config:
          pattern: '(?m)^\s*(🔴|🟡|ℹ️)'


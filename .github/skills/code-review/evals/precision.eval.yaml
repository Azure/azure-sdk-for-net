  - name: report-repeated-issue-once
    prompt: >-
      First invoke the code-review skill. Review this synthetic PR. The PR adds the internal
      file `sdk/widgets/Azure.Widgets/src/WidgetsRestClient.cs` to the shipping library
      Azure.Widgets. Its request builders each append a caller-supplied widget name with
      `uri.AppendPath("/widgets/" + widgetName, false);`: `CreateGetWidgetRequest` at line 31,
      `CreateDeleteWidgetRequest` at line 52, and `CreateUpdateWidgetRequest` at line 74. Widget
      names may contain any character, including `/`, `?`, and `#`. The rest of the file is
      correct, and no CI diagnostic covers these lines. Return only a JSON object with
      `comments`, an array of the inline review comments you would post, each with `path`,
      `line`, and `body`, and `summary`, the review body text you would post or an empty string.
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: output-matches
        config:
          pattern: '(?i)escap'
      - type: output-matches
        config:
          pattern: '"line"\s*:\s*"?(?:31|52|74)\b'
      - type: output-matches
        config:
          pattern: '(?i)\b52\b|DeleteWidget'
      - type: output-matches
        config:
          pattern: '(?i)\b74\b|UpdateWidget'
      - type: output-not-matches
        config:
          pattern: '(?s)"line"\s*:\s*"?(?:31|52|74)\b.*"line"\s*:\s*"?(?:31|52|74)\b'

  - name: keep-distinct-issues-in-separate-comments

      Azure.Widgets references this package. The 4.0.0 release notes linked from the PR state:
      "Behavior change: `FrameReader.ReadFrame()` now returns `null` at end of stream instead of
      throwing `EndOfStreamException`." Unchanged Azure.Widgets code reads frames with
      `while (true) { try { var frame = reader.ReadFrame(); Process(frame.Payload); } catch

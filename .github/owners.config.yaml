# Repository ownership configuration.
# Renders .github/CODEOWNERS via: azsdk config codeowners generate

# Instructions for CODEOWNERS file format and automatic build failure notifications:
# https://github.com/Azure/azure-sdk/blob/main/docs/policies/opensource.md#codeowners
#
# IMPORTANT NOTE:
#   The ordering of "ServiceLabel" blocks is important!
#
#   Matching takes place from bottom-to-top and will stop after the
#   first match.  Place less specific matches earlier in the file
#   and more specific matches later.
#
#   Be sure to add new entries in the area they belong, denoted by the
#   header wrapped in "#" characters. (e.g. SDK, EngSys, Management)

version: 1

configs:
  allowed-owner-yaml-paths:
    - "sdk/*/owners.yaml"
  default-section: Client Libraries
  output: ".github/CODEOWNERS"
  minimum-path-owners: 2
  minimum-label-owners: 2

sections:

  - name: Orphaned paths
    # As of 1/15/2026 these paths have no owners:
    # /**
    # /.devcontainer/
    # /common/Perf/

  - name: Repository root
    paths:
    # Catch all for loose files in the root, which are mostly global configuration and
    # should not be changed without team discussion.
    - path: "/*"
      owners: [jsquire, Azure/azure-sdk-write-net-core]

  - name: SDK
    paths:
    # Catch all
    - path: "/sdk/"
      owners: [jsquire, Azure/azure-sdk-write-net-core]

  - name: End-to-End Samples
    paths:
    # Samples catch-all
    - path: "/samples/"
      owners: [jsquire, Azure/azure-sdk-write-net-core]
    - path: "/samples/voicelive/"
      owners: [emilyjiji, xitzhang, pankopon, amber-yujueWang]
      pr-labels: [Voice Live]

  - name: Core Libraries
    paths:
    - path: "/sdk/core/"
      owners: [m-nash, Azure/azure-sdk-write-net-core]
      pr-labels: [Azure.Core]
    - path: "/sdk/core/Azure.Core/**/Identity/"
      owners: [JonathanCrd, Azure/azure-sdk-write-identity]
    - path: "/sdk/identity/"
      owners: [JonathanCrd, Azure/azure-sdk-write-identity]
      pr-labels: [Azure.Identity]
    - path: "/sdk/extensions/"
      owners: [jsquire, Azure/azure-sdk-write-net-core]
      pr-labels: [Extensions]
    - path: "/sdk/tables/"
      owners: [JonathanCrd, jsquire]
      pr-labels: [Tables]
    label-owners:
    - labels: [Azure.Core]
      service-owners: [m-nash, Azure/azure-sdk-write-net-core]
      azure-sdk-owners: [m-nash]
    - labels: [System.ClientModel]
      service-owners: [m-nash, Azure/azure-sdk-write-net-core]
      azure-sdk-owners: [m-nash]
    - labels: [Azure.Identity]
      azure-sdk-owners: [JonathanCrd]
    - labels: [Extensions]
      service-owners: [jsquire, Azure/azure-sdk-write-net-core]
      azure-sdk-owners: [jsquire]
    - labels: [Tables]

name: "Pull Request Re-Review"
on:
  # bots: # Bots processed as bot check in pre-activation job
  # - azure-sdk # Bots processed as bot check in pre-activation job
  # - azure-sdk-automation[bot] # Bots processed as bot check in pre-activation job
  pull_request:
    types:
      - synchronize

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  group: pr-re-review-${{ github.event.pull_request.number }}
  queue: max

run-name: "Re-review PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.pr-re-review
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Pull%20Request%20Re-Review,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore


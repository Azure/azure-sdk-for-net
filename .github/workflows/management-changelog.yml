name: Management Changelog Writeback

on:
  workflow_run:
    workflows: [Verify Links]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Same-repository sdkauto PR to validate changelog writeback
        required: true
        type: string

permissions: {}

jobs:
  update-management-changelogs:
    # workflow_run uses the default-branch definition. Dispatch must also use it:
    # branch-modified JavaScript must never receive this job's write token.
    # Never check out or execute PR code; artifacts are untrusted Markdown data.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'sdkauto/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Commit generated management changelogs to the AutoPR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs/promises');
            const os = require('node:os');
            const path = require('node:path');
            const { promisify } = require('node:util');
            const execFile = promisify(require('node:child_process').execFile);
            const repo = context.repo;
            // Verify Links usually finishes before ADO. Wait for the matching revision's
            // isolated changelog job, not the result of the entire SDK test matrix.
            let check;
            let run = context.payload.workflow_run;
            const requestedNumber = context.payload.inputs?.pull_request_number;
            if (context.eventName === 'workflow_dispatch') {
              if (!/^[1-9]\d*$/.test(requestedNumber ?? '')) throw new Error('Invalid PR number.');
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: Number(requestedNumber) });
              if (pr.state !== 'open') throw new Error('PR is not open.');
              run = { head_repository: pr.head.repo, event: 'pull_request',
                head_branch: pr.head.ref, head_sha: pr.head.sha };
            }
            if (!run) throw new Error('Missing workflow run.');
            if (run.head_repository?.full_name.toLowerCase() !== `${repo.owner}/${repo.repo}`.toLowerCase() ||
                run.event !== 'pull_request' || !run.head_branch.startsWith('sdkauto/')) return;
            const listUrl = 'https://dev.azure.com/azure-sdk/public/_apis/build/builds?definitions=7327&reasonFilter=pullRequest&queryOrder=queueTimeDescending&$top=100&api-version=7.1';
            for (let attempt = 0; attempt < 80; attempt++) {
              const response = await fetch(listUrl);
              if (!response.ok) throw new Error(`Build lookup failed: ${response.status}`);
              const builds = await response.json();
              const candidate = builds.value.find(b => b.triggerInfo?.['pr.sourceSha'] === run.head_sha &&
                b.triggerInfo?.['pr.sourceBranch'] === run.head_branch);
              if (candidate) {
                const response = await fetch(`https://dev.azure.com/azure-sdk/public/_apis/build/builds/${candidate.id}/timeline?api-version=7.1`);
                if (!response.ok) throw new Error(`Timeline lookup failed: ${response.status}`);
                const timeline = await response.json();
                const job = timeline.records.find(r => r.type === 'Job' && r.identifier === 'Build.AutoPrManagementChangelog.__default');
                if (job?.state === 'completed') {
                  if (job.result !== 'succeeded') throw new Error('ADO changelog job did not succeed.');
                  check = { app: { id: 9426 }, conclusion: 'success',
                    name: 'net - pullrequest (Build Generate AutoPR management changelogs)',
                    details_url: `https://dev.azure.com/azure-sdk/public/_build/results?buildId=${candidate.id}` };
                  break;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            if (!check) throw new Error('Timed out waiting for the matching ADO changelog job.');
            const details = new URL(check.details_url);
            if (details.origin !== 'https://dev.azure.com' ||
                !/^\/azure-sdk\/(public|29ec6040-b234-4e31-b139-33dc4287b756)\/_build\/results$/.test(details.pathname)) {
              throw new Error('Unexpected build URL.');
            }
            const buildId = details.searchParams.get('buildId');
            if (!/^\d+$/.test(buildId)) throw new Error('Invalid build ID.');
            const ado = `https://dev.azure.com/azure-sdk/public/_apis/build/builds/${buildId}`;
            async function getAdo(suffix = '') {
              const response = await fetch(`${ado}${suffix}?api-version=7.1`);
              if (!response.ok) throw new Error(`ADO request failed: ${response.status}`);
              return response.json();
            }
            const build = await getAdo();
            if (build.definition.id !== 7327 || build.reason !== 'pullRequest' ||
                build.repository.type !== 'GitHub' ||
                build.repository.id.toLowerCase() !== `${repo.owner}/${repo.repo}`.toLowerCase() ||
                build.triggerInfo?.['pr.sourceSha'] !== run.head_sha ||
                build.triggerInfo?.['pr.sourceBranch'] !== run.head_branch) {
              throw new Error('Unexpected build provenance.');
            }
            const match = /^refs\/pull\/(\d+)\/merge$/.exec(build.sourceBranch);
            if (!match) throw new Error('Build is not for a PR merge ref.');
            const pull_number = Number(match[1]);
            if (requestedNumber && pull_number !== Number(requestedNumber)) throw new Error('Build is for a different PR.');
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number });
            const sourceSha = build.triggerInfo['pr.sourceSha'];
            if (pr.state !== 'open' || pr.head.repo?.full_name.toLowerCase() !== `${repo.owner}/${repo.repo}`.toLowerCase() ||
                !pr.head.ref.startsWith('sdkauto/') || pr.head.ref !== run.head_branch || pr.head.sha !== sourceSha) {
              core.info('Skipping fork, non-AutoPR, closed PR, or stale build.');
              return;
            }
            const timeline = await getAdo('/timeline');
            const job = timeline.records.find(r => r.type === 'Job' &&
              r.identifier === 'Build.AutoPrManagementChangelog.__default' && r.result === 'succeeded');
            if (!job || !timeline.records.some(r => r.parentId === job.id &&
                r.name === 'Run management changelog tool' && r.result === 'succeeded')) {
              throw new Error('Changelog tool did not succeed.');
            }
            const artifacts = await getAdo('/artifacts');
            const artifact = artifacts.value.find(a => a.name === 'ManagementChangelogs' && a.source === job.id);
            if (!artifact) throw new Error('Changelog artifact not found for this job.');
            const download = new URL(artifact.resource.downloadUrl);
            if (download.protocol !== 'https:' || !download.hostname.endsWith('.artifacts.visualstudio.com')) {
              throw new Error('Unexpected artifact host.');
            }
            const response = await fetch(download);
            if (!response.ok) throw new Error(`Artifact download failed: ${response.status}`);
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.length;
              if (size > 10 * 1024 * 1024) throw new Error('Changelog artifact exceeds 10 MiB.');
              chunks.push(chunk);
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { ...repo, pull_number, per_page: 100 });
            if (files.length >= 3000) throw new Error('PR file list may be truncated.');
            const packages = new Set(files.filter(f => f.status !== 'removed').map(f =>
              /^(sdk\/[^/]+\/Azure\.ResourceManager\.[^/]+)\//.exec(f.filename)?.[1]).filter(Boolean));
            const directory = await fs.mkdtemp(path.join(os.tmpdir(), 'management-changelogs-'));
            try {
              const zip = path.join(directory, 'changelogs.zip');
              await fs.writeFile(zip, Buffer.concat(chunks));
              // Read individual entries without extraction, applying patches, or running artifact code.
              const { stdout } = await execFile('unzip', ['-Z1', zip], { maxBuffer: 1024 * 1024 });
              const entries = stdout.trim().split('\n');
              if (entries.length > 1000) throw new Error('Too many artifact entries.');
              const tree = [];
              const seen = new Set();
              for (const entry of entries) {
                const match = /^(?:ManagementChangelogs\/)?(sdk\/[^/]+\/Azure\.ResourceManager\.[^/]+)\/CHANGELOG\.md$/.exec(entry);
                if (!match) continue;
                const packagePath = match[1];
                if (!packages.has(packagePath) || packagePath.split('/').some(s => s === '.' || s === '..')) {
                  throw new Error('Artifact targets an unchanged or invalid package.');
                }
                const filename = `${packagePath}/CHANGELOG.md`;
                if (seen.has(filename)) throw new Error('Duplicate changelog entry.');
                seen.add(filename);
                const { stdout: generatedContent } = await execFile('unzip', ['-p', zip, entry], { maxBuffer: 1024 * 1024 });
                // GitHub's Git API bypasses .gitattributes; normalize Windows tool output before comparing or committing.
                const content = generatedContent.replace(/\r\n/g, '\n');
                const { data: current } = await github.rest.repos.getContent({ ...repo, path: filename, ref: sourceSha });
                if (current.type !== 'file' || current.encoding !== 'base64') throw new Error('Expected existing changelog file.');
                if (Buffer.from(current.content, 'base64').toString('utf8') === content) continue;
                tree.push({ path: filename, mode: '100644', type: 'blob', content });
              }
              if (!tree.length) { core.info('Changelogs are already up to date.'); return; }
              const { data: parent } = await github.rest.git.getCommit({ ...repo, commit_sha: sourceSha });
              const { data: updatedTree } = await github.rest.git.createTree({ ...repo, base_tree: parent.tree.sha, tree });
              const { data: commit } = await github.rest.git.createCommit({ ...repo, tree: updatedTree.sha,
                parents: [sourceSha], message: 'Update management SDK changelogs [skip ci]' });
              const { data: latest } = await github.rest.pulls.get({ ...repo, pull_number });
              if (latest.head.sha !== sourceSha || latest.state !== 'open' || latest.head.ref !== pr.head.ref) {
                core.info('PR changed during generation; leaving the newer revision untouched.'); return;
              }
              // No force push: a concurrent user push also prevents this update from fast-forwarding.
              // GITHUB_TOKEN commits do not emit another workflow event, preventing writeback loops.
              await github.rest.git.updateRef({ ...repo, ref: `heads/${pr.head.ref}`, sha: commit.sha, force: false });
              core.info(`Updated PR #${pull_number}: ${commit.sha}`);
            } finally {
              await fs.rm(directory, { recursive: true, force: true });
            }
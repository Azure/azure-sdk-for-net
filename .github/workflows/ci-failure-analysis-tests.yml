name: CI Failure Analysis Tests

on:
  pull_request:
    paths:
      - '.github/workflows/ci-failure-analysis*'
      - '.github/workflows/ci-failure-analysis/**'
      - '.github/workflows/provisioning-review*'
      - '.github/workflows/shared/copilot-cli-version-probe-guard.md'
      - '.github/workflows/mgmt-review*'
      - '.github/skills/analyze-ci-failures/**'
      - '.github/aw/actions-lock.json'

permissions:
  contents: read

jobs:
  test:
    name: CI workflow guards and cutover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run CI workflow guard and cutover tests
        run: node --test --test-reporter=spec .github/workflows/ci-failure-analysis/guard.test.cjs .github/workflows/ci-failure-analysis/cutover.test.cjs

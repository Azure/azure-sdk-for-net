# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/search/Azure.ResourceManager.Search
    - sdk/search/Azure.Provisioning.Search
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    SDKType: mgmtclient
    ServiceDirectory: search
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Search
      safeName: AzureResourceManagerSearch
    - name: Azure.Provisioning.Search
      safeName: AzureProvisioningSearch
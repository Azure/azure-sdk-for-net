# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/subscription/Azure.ResourceManager.Subscription
    - sdk/subscription/Azure.Provisioning.Subscription
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: subscription
    BuildSnippets: false
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Subscription
      safeName: AzureResourceManagerSubscription
    - name: Azure.Provisioning.Subscription
      safeName: AzureProvisioningSubscription

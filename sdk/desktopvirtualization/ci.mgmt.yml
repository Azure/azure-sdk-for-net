# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/desktopvirtualization/Azure.ResourceManager.DesktopVirtualization
    - sdk/desktopvirtualization/Azure.Provisioning.DesktopVirtualization
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: desktopvirtualization
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.DesktopVirtualization
      safeName: AzureResourceManagerDesktopVirtualization
    - name: Azure.Provisioning.DesktopVirtualization
      safeName: AzureProvisioningDesktopVirtualization

# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/frontdoor/Azure.ResourceManager.FrontDoor
    - sdk/frontdoor/Azure.Provisioning.FrontDoor
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: frontdoor
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.FrontDoor
      safeName: AzureResourceManagerFrontDoor
    - name: Azure.Provisioning.FrontDoor
      safeName: AzureProvisioningFrontDoor
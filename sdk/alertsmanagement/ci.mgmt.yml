# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/alertsmanagement/Azure.ResourceManager.AlertsManagement
    - sdk/alertsmanagement/Azure.ResourceManager.PrometheusRuleGroups
    - sdk/alertsmanagement/Azure.ResourceManager.AlertRuleRecommendations
    - sdk/alertsmanagement/Azure.ResourceManager.AlertProcessingRules
    - sdk/alertsmanagement/Azure.ResourceManager.TenantActivityLogAlerts
    - sdk/alertsmanagement/Azure.ResourceManager.PreviewAlertRule
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: alertsmanagement
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.AlertsManagement
      safeName: AzureResourceManagerAlertsManagement
    - name: Azure.ResourceManager.PrometheusRuleGroups
      safeName: AzureResourceManagerPrometheusRuleGroups
    - name: Azure.ResourceManager.AlertRuleRecommendations
      safeName: AzureResourceManagerAlertRuleRecommendations
    - name: Azure.ResourceManager.AlertProcessingRules
      safeName: AzureResourceManagerAlertProcessingRules
    - name: Azure.ResourceManager.TenantActivityLogAlerts
      safeName: AzureResourceManagerTenantActivityLogAlerts
    - name: Azure.ResourceManager.PreviewAlertRule
      safeName: AzureResourceManagerPreviewAlertRule

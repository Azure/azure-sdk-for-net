# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/applicationinsights/Azure.ResourceManager.ApplicationInsights
    - sdk/applicationinsights/Azure.Provisioning.ApplicationInsights
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: applicationinsights
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.ApplicationInsights
      safeName: AzureResourceManagerApplicationInsights
    - name: Azure.Provisioning.ApplicationInsights
      safeName: AzureProvisioningApplicationInsights

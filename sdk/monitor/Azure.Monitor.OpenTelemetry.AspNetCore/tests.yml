trigger: none

extends:
    template: /eng/pipelines/templates/stages/archetype-sdk-tests.yml
    parameters:
      ServiceDirectory: monitor
      Project: Azure.Monitor.OpenTelemetry.AspNetCore
      TimeoutInMinutes: 120
      InstallTargetFrameworkOnly: true
      TestDisplayName: 'Test: standard [$(DependencyMode), $(BuildConfiguration)]'
      AdditionalTestDisplayName: 'Test: routing [source deps, Release, Live]'
      AdditionalTestScript: sdk/monitor/Azure.Monitor.OpenTelemetry.AspNetCore/tests/Run-MultiEndpointRouting.ps1
      MatrixConfigs:
        - Name: monitor_live
          Path: sdk/monitor/Azure.Monitor.OpenTelemetry.AspNetCore/live-test-matrix.json
          Selection: sparse
          GenerateVMJobs: true
      PostSteps:
        - task: PublishTestResults@2
          displayName: Publish multi-endpoint routing results
          condition: and(succeededOrFailed(), eq(variables['RunAdditionalTests'], 'true'), eq(variables['TestSetupCompleted'], 'true'))
          inputs:
            testResultsFiles: '$(MultiEndpointResultsDirectory)/**/*.trx'
            testResultsFormat: VSTest
            testRunTitle: 'Multi-endpoint routing $(Agent.JobName)'
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true

# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/selfhelp/Azure.ResourceManager.SelfHelp
    - sdk/selfhelp/Azure.Provisioning.SelfHelp
extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: selfhelp
    ArtifactName: packages
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.SelfHelp
      safeName: AzureResourceManagerSelfHelp
    - name: Azure.Provisioning.SelfHelp
      safeName: AzureProvisioningSelfHelp

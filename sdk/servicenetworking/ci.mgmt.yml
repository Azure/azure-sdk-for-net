# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/servicenetworking/Azure.ResourceManager.ServiceNetworking
    - sdk/servicenetworking/Azure.Provisioning.ServiceNetworking
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: servicenetworking
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.ServiceNetworking
      safeName: AzureResourceManagerServiceNetworking
    - name: Azure.Provisioning.ServiceNetworking
      safeName: AzureProvisioningServiceNetworking

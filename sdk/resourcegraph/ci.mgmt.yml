# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/resourcegraph/Azure.ResourceManager.ResourceGraph
    - sdk/resourcegraph/Azure.Provisioning.ResourceGraph
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: resourcegraph
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.ResourceGraph
      safeName: AzureResourceManagerResourceGraph
    - name: Azure.Provisioning.ResourceGraph
      safeName: AzureProvisioningResourceGraph

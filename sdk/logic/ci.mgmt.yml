# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/logic/Azure.ResourceManager.Logic
    - sdk/logic/Azure.Provisioning.Logic
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: logic
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Logic
      safeName: AzureResourceManagerLogic
    - name: Azure.Provisioning.Logic
      safeName: AzureProvisioningLogic

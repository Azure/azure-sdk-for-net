# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/network/Azure.ResourceManager.Network
    - sdk/network/Azure.Provisioning.Network
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: network
    BuildSnippets: false
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Network
      safeName: AzureResourceManagerNetwork
    - name: Azure.Provisioning.Network
      safeName: AzureProvisioningNetwork

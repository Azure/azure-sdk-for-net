# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/cosmosdb/ci.yml
    - sdk/cosmosdb/platform-matrix.json
    - sdk/cosmosdb/service.projects
    - sdk/cosmosdb/Azure.Data.Cosmos

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    SDKType: client
    ServiceDirectory: cosmosdb
    MatrixConfigs:
    - Name: Cosmos_Net10_Only
      Path: sdk/cosmosdb/platform-matrix.json
      Selection: sparse
      GenerateVMJobs: true
    ArtifactName: packages
    Artifacts:
    - name: Azure.Data.Cosmos
      safeName: AzureDataCosmos

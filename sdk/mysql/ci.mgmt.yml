# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/mysql/Azure.ResourceManager.MySql
    - sdk/mysql/Azure.Provisioning.MySql
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: mysql
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.MySql
      safeName: AzureResourceManagerMySql
    - name: Azure.Provisioning.MySql
      safeName: AzureProvisioningMySql

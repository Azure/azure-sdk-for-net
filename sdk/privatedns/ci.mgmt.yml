# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/privatedns/Azure.ResourceManager.PrivateDns
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: privatedns
    BuildSnippets: false
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.PrivateDns
      safeName: AzureResourceManagerPrivateDns
    - name: Azure.Provisioning.PrivateDns
      safeName: AzureProvisioningPrivateDns

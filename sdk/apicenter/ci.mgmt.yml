# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/apicenter/Azure.ResourceManager.ApiCenter
    - sdk/apicenter/Azure.Provisioning.ApiCenter
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: apicenter
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.ApiCenter
      safeName: AzureResourceManagerApiCenter
    - name: Azure.Provisioning.ApiCenter
      safeName: AzureProvisioningApiCenter

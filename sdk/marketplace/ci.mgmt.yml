# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/marketplace/Azure.ResourceManager.Marketplace.Reviews
    - sdk/marketplace/Azure.ResourceManager.Marketplace
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: marketplace
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Marketplace.Reviews
      safeName: AzureResourceManagerMarketplaceReviews
    - name: Azure.ResourceManager.Marketplace
      safeName: AzureResourceManagerMarketplace

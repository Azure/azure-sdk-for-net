# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/appconfiguration/Azure.ResourceManager.AppConfiguration
    - sdk/appconfiguration/Azure.Provisioning.AppConfiguration
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: appconfiguration
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.AppConfiguration
      safeName: AzureResourceManagerAppConfiguration
    - name: Azure.Provisioning.AppConfiguration
      safeName: AzureProvisioningAppConfiguration
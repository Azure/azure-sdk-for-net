# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/recoveryservices/Azure.ResourceManager.RecoveryServices
    - sdk/recoveryservices/Azure.Provisioning.RecoveryServices
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: recoveryservices
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.RecoveryServices
      safeName: AzureResourceManagerRecoveryServices
    - name: Azure.Provisioning.RecoveryServices
      safeName: AzureProvisioningRecoveryServices

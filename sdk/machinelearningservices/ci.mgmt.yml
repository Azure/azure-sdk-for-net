# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/machinelearningservices/Azure.ResourceManager.MachineLearning
    - sdk/machinelearningservices/Azure.Provisioning.MachineLearning
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: machinelearningservices
    BuildSnippets: false
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.MachineLearning
      safeName: AzureResourceManagerMachineLearning
    - name: Azure.Provisioning.MachineLearning
      safeName: AzureProvisioningMachineLearning

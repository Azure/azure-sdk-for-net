# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/datafactory/Azure.ResourceManager.DataFactory
    - sdk/datafactory/Azure.Provisioning.DataFactory
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: datafactory
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.DataFactory
      safeName: AzureResourceManagerDataFactory
    - name: Azure.Provisioning.DataFactory
      safeName: AzureProvisioningDataFactory

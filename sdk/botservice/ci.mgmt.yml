# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/botservice/Azure.ResourceManager.BotService
    - sdk/botservice/Azure.Provisioning.BotService
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: botservice
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.BotService
      safeName: AzureResourceManagerBotService
    - name: Azure.Provisioning.BotService
      safeName: AzureProvisioningBotService

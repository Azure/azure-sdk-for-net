# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/compute/Azure.ResourceManager.Compute
    - sdk/compute/Azure.ResourceManager.Compute.BulkActions
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: compute
    BuildSnippets: false
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Compute
      safeName: AzureResourceManagerCompute
    - name: Azure.Provisioning.Compute
      safeName: AzureProvisioningCompute
    - name: Azure.ResourceManager.Compute.BulkActions
      safeName: AzureResourceManagerComputeBulkActions

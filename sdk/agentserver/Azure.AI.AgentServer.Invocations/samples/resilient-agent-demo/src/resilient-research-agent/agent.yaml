# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

# Deployed under a DISTINCT name from the Python sample (`resilient-research-agent`)
# so both can coexist in the same Foundry project without collision.
kind: hosted
name: resilient-research-agent-dotnet
description: |
    Demo agent showcasing crash-resilient, steerable, long-running tasks on the
    Invocations protocol (.NET). Bridges a durable, session-scoped resilient task to
    a per-turn SSE stream: survives container crashes and auto-resumes from its last
    checkpoint on restart, winds down cooperatively on steering, and keeps the sandbox
    warm past the eviction window via the task-lease keep-alive.
metadata:
    tags:
        - AI Agent Hosting
        - Invocations Protocol
        - Bring Your Own
        - .NET
        - Resilient Tasks
        - Crash Resilience
protocols:
    - protocol: invocations
      version: 1.0.0
resources:
    cpu: "1"
    memory: 2Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.4-nano
    # NOTE: the demo-only crash sentinel (POST /invocations {"message":"crash"} →
    # Environment.Exit(137)) is enabled at the container-image level via `ENV DEMO_MODE=1`
    # in the Dockerfile — the same pattern the responses demo uses — so it is NOT set here.
    # A production image would leave DEMO_MODE off (default).
    #
    # ── Regression-gate cadence (hosted default) ────────────────────────────
    # NUM_PHASES=3 with 1s cooldowns → a full run reaches a terminal state in well
    # under a minute, so crash→recover / steer / cancel scenarios (and demo-client.sh)
    # complete quickly. Verified end-to-end against the live hosted agent.
    #
    # For a LONG-RUNNING showcase that exercises the resilient-task lease keep-alive
    # ~2x past the platform's ~15-min sandbox-eviction window (matching the Python
    # demo's committed cadence), override to NUM_PHASES=15, INTRA/INTER=30,
    # TARGET_OUTPUT_TOKENS=1500 (≈33-min run). Local Program.cs defaults (10/20s)
    # apply when running outside the hosted container.
    - name: NUM_PHASES
      value: "3"
    - name: CALLS_PER_PHASE
      value: "4"
    - name: INTRA_PHASE_COOLDOWN_SEC
      value: "1"
    - name: INTER_PHASE_COOLDOWN_SEC
      value: "1"
    - name: TARGET_OUTPUT_TOKENS
      value: "150"

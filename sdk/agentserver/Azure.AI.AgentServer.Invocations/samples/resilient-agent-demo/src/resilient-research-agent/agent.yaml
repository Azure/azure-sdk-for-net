# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

# Deployed under a DISTINCT name from the Python sample (`resilient-research-agent`)
# so both can coexist in the same Foundry project without collision.
kind: hosted
name: resilient-research-agent-dotnet
description: |
    Demo agent showcasing crash-resilient, steerable, long-running tasks on the
    Invocations protocol (.NET). Bridges a durable, session-scoped resilient task to
    a per-turn SSE stream: survives container crashes and auto-resumes from its last
    checkpoint on restart, winds down cooperatively on steering, and keeps the sandbox
    warm past the eviction window via the task-lease keep-alive.
metadata:
    tags:
        - AI Agent Hosting
        - Invocations Protocol
        - Bring Your Own
        - .NET
        - Resilient Tasks
        - Crash Resilience
protocols:
    - protocol: invocations
      version: 1.0.0
resources:
    cpu: "1"
    memory: 2Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.4-nano
    # ── Long-running showcase cadence (hosted default) ──────────────────────
    # Per-phase ≈ real LLM subcalls + 3×30s intra + 30s inter cooldowns ≈ 132s,
    # × 15 phases ≈ 33 min — runs ~2x past the platform's ~15-min sandbox-eviction
    # window so each demo run exercises the resilient-task lease keep-alive path
    # end-to-end (the behavior this sample exists to showcase). Drive it with
    # demo-client.sh. Local Program.cs defaults (10/20s, shorter) apply when running
    # outside the hosted container for fast iteration.
    #
    # For a FAST regression cadence (e.g. an automated battery that must reach a
    # terminal state quickly), override to NUM_PHASES=3, INTRA/INTER=1, and a small
    # TARGET_OUTPUT_TOKENS so a full run lands in well under a minute.
    - name: NUM_PHASES
      value: "15"
    - name: CALLS_PER_PHASE
      value: "4"
    - name: INTRA_PHASE_COOLDOWN_SEC
      value: "30"
    - name: INTER_PHASE_COOLDOWN_SEC
      value: "30"
    - name: TARGET_OUTPUT_TOKENS
      value: "1500"

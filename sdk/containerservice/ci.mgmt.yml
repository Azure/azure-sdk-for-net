# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/containerservice/Azure.ResourceManager.ContainerService
    - sdk/containerservice/Azure.Provisioning.ContainerService
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: containerservice
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.ContainerService
      safeName: AzureResourceManagerContainerService
    - name: Azure.Provisioning.ContainerService
      safeName: AzureProvisioningContainerService

# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/qumulo/Azure.Provisioning.Qumulo
    - sdk/qumulo/Azure.ResourceManager.Qumulo
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: qumulo
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.Provisioning.Qumulo
      safeName: AzureProvisioningQumulo
    - name: Azure.ResourceManager.Qumulo
      safeName: AzureResourceManagerQumulo

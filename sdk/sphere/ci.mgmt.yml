# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/sphere/Azure.ResourceManager.Sphere
    - sdk/sphere/Azure.Provisioning.Sphere
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: sphere
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Sphere
      safeName: AzureResourceManagerSphere
    - name: Azure.Provisioning.Sphere
      safeName: AzureProvisioningSphere

# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/securitycenter/Azure.ResourceManager.SecurityCenter
    - sdk/securitycenter/Azure.Provisioning.SecurityCenter
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: securitycenter
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.SecurityCenter
      safeName: AzureResourceManagerSecurityCenter
    - name: Azure.Provisioning.SecurityCenter
      safeName: AzureProvisioningSecurityCenter

# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/containerregistry/Azure.ResourceManager.ContainerRegistry
    - sdk/containerregistry/Azure.ResourceManager.ContainerRegistry.Tasks
    - sdk/containerregistry/Azure.Provisioning.ContainerRegistry
    - sdk/containerregistry/Azure.Provisioning.ContainerRegistry.Tasks
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    SDKType: mgmtclient
    ServiceDirectory: containerregistry
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.ContainerRegistry
      safeName: AzureResourceManagerContainerRegistry
    - name: Azure.ResourceManager.ContainerRegistry.Tasks
      safeName: AzureResourceManagerContainerRegistryTasks
    - name: Azure.Provisioning.ContainerRegistry
      safeName: AzureProvisioningContainerRegistry
    - name: Azure.Provisioning.ContainerRegistry.Tasks
      safeName: AzureProvisioningContainerRegistryTasks

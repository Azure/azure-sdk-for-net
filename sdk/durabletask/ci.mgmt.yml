# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/durabletask/Azure.ResourceManager.DurableTask
    - sdk/durabletask/Azure.Provisioning.DurableTask
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: durabletask
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.DurableTask
      safeName: AzureResourceManagerDurableTask
    - name: Azure.Provisioning.DurableTask
      safeName: AzureProvisioningDurableTask

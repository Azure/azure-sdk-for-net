# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/storage/Azure.ResourceManager.Storage
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    SDKType: mgmt
    ServiceDirectory: storage
    BuildSnippets: false
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.Storage
      safeName: AzureResourceManagerStorage
    - name: Azure.Provisioning.Storage
      safeName: AzureProvisioningStorage
    TestSetupSteps:
    - template: /sdk/storage/tests-install-azurite.yml

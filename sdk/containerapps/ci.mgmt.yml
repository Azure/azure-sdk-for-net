# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/containerapps/Azure.ResourceManager.AppContainers
    - sdk/containerapps/Azure.Provisioning.AppContainers
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: containerapps
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.AppContainers
      safeName: AzureResourceManagerAppContainers
    - name: Azure.Provisioning.AppContainers
      safeName: AzureProvisioningAppContainers

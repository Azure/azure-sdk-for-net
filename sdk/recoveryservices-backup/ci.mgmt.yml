# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/recoveryservices-backup/Azure.ResourceManager.RecoveryServicesBackup
    - sdk/recoveryservices-backup/Azure.Provisioning.RecoveryServicesBackup
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: recoveryservices-backup
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.RecoveryServicesBackup
      safeName: AzureResourceManagerRecoveryServicesBackup
    - name: Azure.Provisioning.RecoveryServicesBackup
      safeName: AzureProvisioningRecoveryServicesBackup

# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
  paths:
    include:
    - sdk/serialconsole/Azure.ResourceManager.SerialConsole

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: serialconsole
    LimitForPullRequest: true
    Artifacts:
    - name: Azure.ResourceManager.SerialConsole
      safeName: AzureManagementSerialConsole

# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
# Excludes eng/scripts/typespec as these are only used in the eng/packages/http-client-csharp/ci.yml pipeline.

trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
      - eng/packages/http-client-csharp-mgmt/ci.yml
      - eng/pipelines/templates/archetype-typespec-emitter.yml
      - eng/pipelines/templates/stages/update-mgmt-generator-dependency.yml
      - .github/workflows/close-stale-generator-upgrade-prs.yml
    exclude:
      - eng/scripts/typespec

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
      - eng/packages/http-client-csharp-mgmt/ci.yml
      - eng/pipelines/templates/archetype-typespec-emitter.yml
      - eng/pipelines/templates/stages/update-mgmt-generator-dependency.yml
      - .github/workflows/close-stale-generator-upgrade-prs.yml
    exclude:
      - eng/scripts/typespec

extends:
  template: /eng/common/pipelines/templates/stages/archetype-sdk-tool-pwsh.yml
  parameters:
    TargetDirectory: eng/scripts/
    TargetTags: 'UnitTest,SdkCompatibilityTest'
    # Preserve the shared suite's existing reporting policy, but explicitly gate
    # the dependency-automation regressions (the shared step does not fail on Pester errors).
    CustomTestSteps:
      - pwsh: |
          Import-Module Pester -MinimumVersion 5.7.1 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.CodeCoverage.Enabled = $true
          $config.TestResult.Enabled = $true
          $config.Run.PassThru = $true
          $config.Filter.Tag = @('UnitTest', 'SdkCompatibilityTest')
          $env:PESTER_TEST_RUN = 'true'
          Invoke-Pester -Configuration $config | Out-Host
          $result = Invoke-Pester -Path ./tests/Update-MgmtGeneratorDependency.Tests.ps1,./tests/Mgmt-Dependency-Pipeline.Tests.ps1,./tests/TypeSpec-Emitter-PullRequest.Tests.ps1 -Tag UnitTest -PassThru
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or $result.TotalCount -eq 0) {
            throw 'Management dependency automation tests failed or were not discovered.'
          }
          $global:LASTEXITCODE = 0
        displayName: Run PowerShell tests and enforce dependency regressions
        workingDirectory: $(Build.SourcesDirectory)/eng/scripts
    PreTestSteps:
      # The tests do not consume repository history or tags. Declaring checkout here replaces
      # the implicit checkout performed by Azure Pipelines rather than adding another fetch.
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - task: UseDotNet@2
        displayName: 'Use .NET SDK'
        retryCountOnTaskFailure: 3
        inputs:
          useGlobalJson: true
          performMultiLevelLookup: true

      - task: NuGetAuthenticate@1

      - task: UseDotNet@2
        displayName: Use .NET 8 SDK for compatibility fixtures
        retryCountOnTaskFailure: 3
        inputs:
          packageType: sdk
          performMultiLevelLookup: true
          version: "8.0.x"

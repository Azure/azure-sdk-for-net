# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
# Excludes eng/scripts/typespec as these are only used in the eng/packages/http-client-csharp/ci.yml pipeline.

trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
    exclude:
      - eng/scripts/typespec

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/scripts/*
    exclude:
      - eng/scripts/typespec

extends:
  template: /eng/common/pipelines/templates/stages/archetype-sdk-tool-pwsh.yml
  parameters:
    TargetDirectory: eng/scripts/
    TargetTags: 'UnitTest'
    PreTestSteps:
      # The unit tests do not consume repository history or tags. Declaring checkout here replaces
      # the implicit checkout performed by Azure Pipelines rather than adding another fetch.
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - task: UseDotNet@2
        displayName: 'Use .NET SDK'
        retryCountOnTaskFailure: 3
        inputs:
          useGlobalJson: true
          performMultiLevelLookup: true

# Summary job: merges every shard's JUnit into one rollup (Markdown summary + Tests tab) and
# gates on it when failOnFailedTests is true.

parameters:
  - name: matrixStageName
    type: string
    default: Prepare
  - name: evalStageName
    type: string
    default: Eval
  - name: artifactPrefix
    # Literal prefix, including any separator (e.g. 'forced-'); must match the shard job.
    # Callers are responsible for unique final artifact names across tracks in one build.
    type: string
    default: ''
  - name: failOnFailedTests
    # Only single-run evaluations support this gate; multi-run observations must leave it off.
    type: boolean
    default: false
  - name: createDashboardBundle
    type: boolean
    default: false
  - name: publishDashboardResults
    type: boolean
    default: false

jobs:
  - job: Summarize
    displayName: 'Consolidate, publish + gate results'
    pool:
      name: $(LINUXPOOL)
      image: $(LINUXVMIMAGE)
      os: linux
    workspace:
      clean: all
    variables:
      EvalExpectedMatrix: $[ stageDependencies.${{ parameters.matrixStageName }}.generate_eval_matrix.outputs['detect.matrix'] ]
    templateContext:
      outputs:
        - output: pipelineArtifact
          displayName: 'Retain selected build summary and saved bundle'
          artifactName: 'eval-summary-${{ parameters.artifactPrefix }}$(System.JobAttempt)'
          targetPath: $(Build.ArtifactStagingDirectory)/eval-summary
          condition: always()
    steps:
      # Dashboard archives identify a single build-wide summary, not separate tracks.
      - ${{ if and(ne(parameters.artifactPrefix, ''), or(parameters.createDashboardBundle, parameters.publishDashboardResults)) }}:
        - script: |
            echo "##vso[task.logissue type=error]Prefixed eval tracks support artifact-only summaries, not dashboard bundles or publication."
            exit 1
          displayName: 'Reject ambiguous multi-track dashboard identity'

      - checkout: self
        clean: true
        fetchDepth: 1

      - task: UseNode@1
        displayName: 'Use Node.js 24.x'
        inputs:
          version: 24.x

      # Download only this track's result data; an empty prefix retains all eval-result-* artifacts.
      - task: DownloadPipelineArtifact@2
        displayName: 'Download all shard results'
        inputs:
          buildType: 'current'
          itemPattern: |
            eval-result-${{ parameters.artifactPrefix }}*/results.jsonl
            eval-result-${{ parameters.artifactPrefix }}*/shard.json
            eval-result-${{ parameters.artifactPrefix }}*/**/*.junit.xml
          targetPath: $(Pipeline.Workspace)/eval-results

      # Only attempt verification needs the current build token; rendering uses saved evidence.
      - script: |
          node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/lib/shard-results.ts" \
            --attempts-output "$(Build.ArtifactStagingDirectory)/eval-summary/job-attempts.json"
        displayName: 'Verify latest shard job attempts from current build timeline'
        condition: always()
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          EVAL_EXPECTED_MATRIX: $(EvalExpectedMatrix)
          EVAL_STAGE_NAME: ${{ parameters.evalStageName }}

      - script: |
          node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/build-eval-summary.ts" \
            --results-root "$(Pipeline.Workspace)/eval-results" \
            --selected-root "$(Pipeline.Workspace)/eval-selected" \
            --attempts-file "$(Build.ArtifactStagingDirectory)/eval-summary/job-attempts.json" \
            --output-path "$(Build.ArtifactStagingDirectory)/eval-summary/eval-summary.md"
        displayName: 'Select expected latest attempts and render complete-build summary'
        condition: always()
        env:
          EVAL_EXPECTED_MATRIX: $(EvalExpectedMatrix)
          EVAL_ARTIFACT_PREFIX: ${{ parameters.artifactPrefix }}

      - ${{ if or(parameters.createDashboardBundle, parameters.publishDashboardResults) }}:
        - template: ../steps/eval-publish-results.yml
          parameters:
            publishDashboardResults: ${{ parameters.publishDashboardResults }}

      # Completed failing evals are useful data: publish BEFORE the evaluation gate.
      - task: PublishTestResults@2
        displayName: 'Publish eval rollup'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '$(Pipeline.Workspace)/eval-selected/**/*.junit.xml'
          mergeTestResults: true
          failTaskOnFailedTests: ${{ parameters.failOnFailedTests }}
          failTaskOnMissingResultsFile: true
          testRunTitle: 'Vally evals'

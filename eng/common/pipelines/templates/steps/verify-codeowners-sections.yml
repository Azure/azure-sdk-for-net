# Compatibility shim: this check is now a no-op.
#
# Section drift checking existed because .github/CODEOWNERS was hand maintained and entries could be
# written under the wrong section heading. The file is now generated by
# `azsdk config codeowners generate` from .github/owners.config.yaml, which places every entry in the
# section its configuration assigns, so there is no drift for a build to detect.
#
# The template is kept so pipelines that still reference it keep parsing. Remove those references,
# then delete this file.
parameters:
  SourceRootPath: '$(System.DefaultWorkingDirectory)'
  TempDirectory: '$(Agent.TempDirectory)/codeowners-check'
  Sections: []

steps: []

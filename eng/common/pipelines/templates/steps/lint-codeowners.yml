parameters:
  - name: SourceRootPath
    type: string
    default: '$(System.DefaultWorkingDirectory)'
  - name: ArtifactPath
    type: string
    default: $(Build.ArtifactStagingDirectory)/PackageInfo
  - name: Artifacts
    # Compatibility: Removing the Artifacts param breaks eng/common. Keeping it
    # here for now to avoid breaking changes. This can be removed once the .NET
    # invocation of this template is updated to omit Artifacts
    type: object
    default: []
  - name: Repo
    type: string
    default: $(Build.Repository.Name)
  - name: SdkTypes
    type: object
    default:
      - client
      - compat
      - data
      - functions
      - datamovement
  # Comma separated list of emails allowed to skip codeowners validation. User
  # must queue the pipeline manually with the 'Skip.VerifyCodeowners' variable
  # set to 'true'.
  - name: AllowSkipEmails
    type: string
    default: ''

steps:
  - task: PowerShell@2
    displayName: Evaluate Codeowners Skip
    condition: succeeded()
    inputs:
      pwsh: true
      filePath: ${{ parameters.SourceRootPath }}/eng/common/scripts/Set-VerifyCodeownersSkip.ps1
      arguments: >-
        -RequestedForEmail '$(Build.RequestedForEmail)'
        -SkipVerifyCodeowners '$(Skip.VerifyCodeowners)'
        -AdditionalSkipEmails '${{ parameters.AllowSkipEmails }}'
      workingDirectory: ${{ parameters.SourceRootPath }}

  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    # .github/CODEOWNERS is generated from ownership YAML, so a hand edit is either lost on the next
    # render or silently diverges from the YAML that is supposed to be the source of truth. This runs
    # ahead of the ownership-YAML steps below and outside their guard: a repository that has not
    # migrated yet still has a CODEOWNERS worth protecting, and this check needs no CLI.
    - pwsh: |
        $scriptPath = [System.IO.Path]::Combine("${{ parameters.SourceRootPath }}", "eng", "common", "scripts", "get-changedfiles.ps1")
        try {
          $changedFiles = & $scriptPath `
            -DiffPath ".github/CODEOWNERS" `
            -DiffFilterType ''

          if ($LASTEXITCODE -gt 1) {
            Write-Host "git diff returned exit code $LASTEXITCODE, which indicates an error. Output: $changedFiles"
            exit 1
          }
        } catch {
          Write-Host "Error running get-changedfiles.ps1: $_"
          exit 1
        }

        if (!$changedFiles) {
          Write-Host "CODEOWNERS file has not changed."
          exit 0
        }

        # The render is published by automation, which is the one author allowed to touch the
        # generated file.
        $prNumber = "$(System.PullRequest.PullRequestNumber)"
        $repoName = "$(Build.Repository.Name)"
        $prUrl = "https://api.github.com/repos/$repoName/pulls/$prNumber"
        $prData = Invoke-RestMethod -Uri $prUrl -MaximumRetryCount 10 -RetryIntervalSec 6
        $prAuthor = $prData.user.login
        Write-Host "PR author: $prAuthor"

        if ($prAuthor -ieq 'azure-sdk-automation[bot]') {
          Write-Host "PR opened by azure-sdk-automation[bot]. CODEOWNERS may be updated."
          exit 0
        }

        Write-Host "##vso[task.logissue type=error].github/CODEOWNERS is a generated file and was modified by hand."
        Write-Host ""
        Write-Host "Revert the change and edit the owners YAML instead:"
        Write-Host "    .github/owners.config.yaml   repository-wide sections and static entries"
        Write-Host "    sdk/<service>/owners.yaml    per-service ownership"
        Write-Host ""
        Write-Host "See https://aka.ms/azsdk/codeowners"
        exit 1
      displayName: 'Block direct CODEOWNERS edits'
      workingDirectory: ${{ parameters.SourceRootPath }}
      condition: and(succeeded(), ne(variables['ShouldSkipVerifyCodeowners'], 'true'))

    # Ownership YAML is not covered by the release check below: a change to sdk/<service>/owners.yaml
    # produces no package artifacts, so nothing downstream would look at it. Lint is what catches an
    # invalid owner before it is merged.
    - pwsh: |
        if (!(Test-Path ".github/owners.config.yaml")) {
          Write-Host "This repository does not use ownership YAML yet."
          Write-Host "##vso[task.setvariable variable=ShouldLintCodeowners]false"
          exit 0
        }

        $scriptPath = [System.IO.Path]::Combine("${{ parameters.SourceRootPath }}", "eng", "common", "scripts", "get-changedfiles.ps1")
        try {
          # A single pathspec, so match both owners.yaml fragments and the repo-level config and
          # filter the result below rather than diffing twice.
          $changedFiles = & $scriptPath `
            -DiffPath "*owners*.y*ml" `
            -DiffFilterType ''

          if ($LASTEXITCODE -gt 1) {
            Write-Host "git diff returned exit code $LASTEXITCODE, which indicates an error. Output: $changedFiles"
            exit 1
          }
        } catch {
          Write-Host "Error running get-changedfiles.ps1: $_"
          exit 1
        }

        $ownershipFiles = @($changedFiles | Where-Object { $_ -match '(^|/)owners\.ya?ml$' -or $_ -eq ".github/owners.config.yaml" })

        if (!$ownershipFiles) {
          Write-Host "No ownership YAML changed."
          Write-Host "##vso[task.setvariable variable=ShouldLintCodeowners]false"
          exit 0
        }

        Write-Host "Ownership YAML changed:"
        $ownershipFiles | ForEach-Object { Write-Host "    $_" }
        Write-Host "##vso[task.setvariable variable=ShouldLintCodeowners]true"
      displayName: 'Check if ownership YAML changed'
      workingDirectory: ${{ parameters.SourceRootPath }}
      condition: and(succeeded(), ne(variables['ShouldSkipVerifyCodeowners'], 'true'))

    - template: /eng/common/pipelines/templates/steps/install-azsdk-cli.yml
      parameters:
        SourceRootPath: ${{ parameters.SourceRootPath }}
        Condition: and(succeeded(), eq(variables['ShouldLintCodeowners'], 'true'))

    # Every fragment, not just the changed ones. The config carries the owner minimums, so a change
    # to it invalidates fragments nobody touched, and the whole set is what makes the repository-wide
    # discovery rules apply -- linting named files one at a time skips them.
    #
    # No credential: lint reads the membership caches from anonymously readable blob storage.
    - pwsh: |
        & "$(AZSDK)" config codeowners lint-fragments --repo-root "${{ parameters.SourceRootPath }}"

        if ($LASTEXITCODE) {
          Write-Host "##vso[task.logissue type=error]Ownership YAML failed lint. See the violations above."
          exit 1
        }
      displayName: 'Lint ownership YAML'
      workingDirectory: ${{ parameters.SourceRootPath }}
      condition: and(succeeded(), eq(variables['ShouldLintCodeowners'], 'true'))

  - ${{ elseif eq(variables['Build.Reason'], 'Manual') }}:
    - template: /eng/common/pipelines/templates/steps/install-azsdk-cli.yml
      parameters:
        SourceRootPath: ${{ parameters.SourceRootPath }}
        Condition: and(succeeded(), ne(variables['ShouldSkipVerifyCodeowners'], 'true'))

    # A release is the last point where bad ownership is still cheap to fix, so every package being
    # released is checked against the membership caches for both path owners and label owners. This
    # asks about the packages in the build rather than the files in a diff, which is why it is a
    # separate check from the lint above and not a special case of it.
    - task: PowerShell@2
      displayName: Verify Codeowners
      condition: and(succeeded(), ne(variables['ShouldSkipVerifyCodeowners'], 'true'))
      inputs:
        pwsh: true
        filePath: ${{ parameters.SourceRootPath }}/eng/common/scripts/Test-CodeownersForArtifacts.ps1
        arguments: >-
          -AzsdkPath '$(AZSDK)'
          -PackageInfoDirectory '${{ parameters.ArtifactPath }}'
          -SdkTypes ${{ join(',', parameters.SdkTypes) }}
          -Repo '${{ parameters.Repo }}'
        workingDirectory: ${{ parameters.SourceRootPath }}

# Invokes `vally eval` for one shard. UseAzSdkAuthentication=false (default) runs the hermetic
# node script directly. UseAzSdkAuthentication=true wraps the same run in AzureCLI@2 so a live
# MCP's Azure DevOps calls inherit the service-connection identity.
# UseGitHubAppAuthentication opts into a scoped Copilot token; otherwise the eval PAT is used.

parameters:
  - name: vallyRoot
    type: string
  - name: UseAzSdkAuthentication
    type: boolean
    default: false
  - name: UseGitHubAppAuthentication
    type: boolean
    default: false
  - name: threshold
    # Pass-rate gate passed to `vally eval --threshold` and the shard verdict in invoke-eval-shard.js.
    type: number
    default: 0.8
  - name: azureSubscription
    type: string
    default: opensource-api-connection

steps:
  - ${{ if and(parameters.UseGitHubAppAuthentication, ne(variables['Build.Reason'], 'PullRequest')) }}:
    - template: /eng/common/pipelines/templates/steps/login-to-github.yml
      parameters:
        TokenOwners:
          - ${{ split(variables['Build.Repository.Name'], '/')[0] }}
        VariableNamePrefix: COPILOT_GITHUB_TOKEN
        TokenRequest:
          repositories:
            - ${{ split(variables['Build.Repository.Name'], '/')[1] }}
          permissions:
            organization_copilot_requests: read
            metadata: read

  - ${{ if parameters.UseAzSdkAuthentication }}:
    - task: AzureCLI@2
      displayName: 'vally eval $(shardName) (authenticated)'
      inputs:
        azureSubscription: ${{ parameters.azureSubscription }}
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: ${{ parameters.vallyRoot }}
        inlineScript: |
          node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/invoke-eval-shard.ts" \
            --eval-args "$(evalArgs)" \
            --shard-name "$(shardName)" \
            --output-dir "$(Build.SourcesDirectory)/artifacts/vally-results/$(shardName)" \
            --threshold ${{ parameters.threshold }}
      ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
        env:
          ${{ if parameters.UseGitHubAppAuthentication }}:
            COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
            GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
          ${{ else }}:
            GITHUB_TOKEN: $(azuresdk-copilot-github-pat)

  - ${{ else }}:
    - script: |
        node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/invoke-eval-shard.ts" \
          --eval-args "$(evalArgs)" \
          --shard-name "$(shardName)" \
          --output-dir "$(Build.SourcesDirectory)/artifacts/vally-results/$(shardName)" \
          --threshold ${{ parameters.threshold }}
      displayName: 'vally eval $(shardName)'
      workingDirectory: ${{ parameters.vallyRoot }}
      ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
        env:
          ${{ if parameters.UseGitHubAppAuthentication }}:
            COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
            GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
          ${{ else }}:
            GITHUB_TOKEN: $(azuresdk-copilot-github-pat)

parameters:
  ConfigFileDir: ''
  PackageArtifactName: ''
  SourceRootPath: $(Build.SourcesDirectory)
  ReleasePlanId: 0
  SdkPullRequest: ''

steps:
  - template: /eng/common/pipelines/templates/steps/install-azsdk-cli.yml
    parameters:
      SourceRootPath: ${{ parameters.SourceRootPath }}

  # Runtime output variables must not be tested at template-expansion time.
  # Initialize the optional macro before use on manual runs that have no SDK PR.
  - ${{ if eq(parameters.SdkPullRequest, '') }}:
    - pwsh: Write-Host '##vso[task.setvariable variable=AutoReleaseSdkPullRequestUrl]'
      displayName: Initialize optional auto-release SDK PR
      condition: and(succeeded(), ne(variables['Skip.MarkReleaseCompletion'], 'true'), eq(variables['AutoReleaseSdkPullRequestUrl'], ''))

  - task: AzureCLI@2
    inputs:
      azureSubscription: opensource-api-connection
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: ${{ parameters.SourceRootPath }}/eng/common/scripts/Mark-ReleasePlanCompletion.ps1
      arguments: >
        -PackageInfoFilePath '${{ parameters.ConfigFileDir }}/${{ parameters.PackageArtifactName }}.json' -AzsdkExePath '$(AZSDK)'
        -ReleasePlanId '${{ parameters.ReleasePlanId }}'
        -SdkPullRequest '${{ coalesce(parameters.SdkPullRequest, '$(AutoReleaseSdkPullRequestUrl)') }}'
        -PipelineUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
      workingDirectory: $(Pipeline.Workspace)
    displayName: Mark package as released
    continueOnError: true
    condition: and(succeeded(), ne(variables['Skip.MarkReleaseCompletion'], 'true'))

# Hermetic workflow-scenario eval CI: runs the unit-tool + mock workflow-scenario evals in
# evals against the mock MCP (live tier runs in live-eval.yml).

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - evals/**
      - tools/azsdk-cli/Azure.Sdk.Tools.Mock/**
      # Cli tool catalog + skills feed the eval results, so changes here must retrigger.
      - tools/azsdk-cli/Azure.Sdk.Tools.Cli/**
      - .github/skills/**
      - eng/common/pipelines/workflow-eval.yml
      - eng/common/pipelines/templates/jobs/**
      - eng/common/pipelines/templates/steps/eval-invoke.yml
      - eng/common/pipelines/templates/steps/eval-mcp-setup.yml
      - eng/common/pipelines/templates/steps/eval-publish-results.yml
      - eng/common/pipelines/templates/stages/archetype-eval.yml
      - eng/common/pipelines/templates/variables/eval-dashboard.yml
      - eng/common/scripts/eval/**

pr: none

parameters:
  - name: autoPublishDashboardResults
    displayName: 'Automatically publish trusted tools main builds (disable to opt out)'
    type: boolean
    default: true
  - name: publishDashboardResults
    displayName: 'Publish the complete build bundle directly to Blob'
    type: boolean
    default: false
  - name: allowAzureStorageNetworkAccess
    displayName: 'Allow Azure Storage network access for this publishing pipeline (all processes)'
    type: boolean
    default: false
  - name: storageServiceConnection
    type: string
    default: eval-dashboard-sc
  - name: storageContainerUrl
    type: string
    default: https://evaltestsummary.blob.core.windows.net/vally-results
  - name: storageSmokeTest
    displayName: 'Manual synthetic storage test (no MCP, evaluations or LLM calls)'
    type: boolean
    default: false
  - name: notifyDashboard
    type: boolean
    default: false
  - name: dashboardUrl
    type: string
    default: ''
  - name: dashboardAudience
    type: string
    default: ''

variables:
  # Defines LINUXPOOL + LINUXVMIMAGE used by the archetype's jobs.
  - template: /eng/pipelines/templates/variables/image.yml
  - template: /eng/common/pipelines/templates/variables/eval-dashboard.yml
    parameters:
      enableAutomaticPublication: ${{ and(parameters.autoPublishDashboardResults, not(parameters.storageSmokeTest)) }}
      pipelineDefinitionId: '8255'
  # Provides the secret azuresdk-copilot-github-pat, mapped into GITHUB_TOKEN in the invoke step.
  - ${{ if not(parameters.storageSmokeTest) }}:
    - group: AzSDK_Eval_Variable_group

extends:
  template: /eng/common/pipelines/templates/stages/archetype-eval.yml
  parameters:
    createDashboardBundle: true
    publishDashboardResults: ${{ or(parameters.publishDashboardResults, eq(variables['EvalDashboardAutomaticPublication'], 'true')) }}
    allowAzureStorageNetworkAccess: ${{ or(parameters.allowAzureStorageNetworkAccess, eq(variables['EvalDashboardAutomaticPublication'], 'true')) }}
    storageServiceConnection: ${{ parameters.storageServiceConnection }}
    storageContainerUrl: ${{ parameters.storageContainerUrl }}
    storageSmokeTest: ${{ parameters.storageSmokeTest }}
    notifyDashboard: ${{ parameters.notifyDashboard }}
    dashboardUrl: ${{ parameters.dashboardUrl }}
    dashboardAudience: ${{ parameters.dashboardAudience }}
    # Shared mock/live builder; select the mock tier.
    mcpSetupTemplate: /eng/common/pipelines/templates/steps/eval-mcp-setup.yml
    TestType: mock
    vallyRoot: evals
    # Per-shard job timeout (report-only tier).
    shardTimeoutInMinutes: 20
    # Pass-rate gate for `vally eval`. This tier is report-only (failOnFailedTests defaults false),
    # so the threshold only colors the verdict; a repo/team can raise or lower it here.
    threshold: 0.8
    # This repo needs no repo-specific setup (the mock MCP is built by the common BuildMcp job).
    # A spec/language repo that must start its own bot / server / MCP copies the example hook and
    # points these at it — see eng/common/pipelines/templates/steps/eval-hook-example.yml.
    # preEvalTemplate: /eng/pipelines/eval/start-my-bot.yml
    # postEvalTemplate: /eng/pipelines/eval/stop-my-bot.yml

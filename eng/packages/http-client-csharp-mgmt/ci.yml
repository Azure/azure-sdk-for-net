trigger:
  branches:
    include:
      - main
  paths:
    include:
      - eng/packages/http-client-csharp-mgmt
      - eng/pipelines/templates/archetype-typespec-emitter.yml
      - eng/scripts/typespec
pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - eng/packages/http-client-csharp-mgmt
      - eng/pipelines/templates/archetype-typespec-emitter.yml
      - eng/scripts/typespec

parameters:
  - name: UseTypeSpecNext
    displayName: "Use TypeSpec Next"
    type: boolean
    default: false
  - name: ShouldPublish
    displayName: "Publish packages"
    type: boolean
    default: false
  - name: PublishPublic
    displayName: "Publish to npmjs.org"
    type: boolean
    default: false
  - name: ShouldRegenerate
    displayName: "Regenerate clients"
    type: boolean
    default: false
  - name: RegenerateAllServices
    displayName: "Regenerate all services (instead of the priority list)"
    type: boolean
    default: false
  - name: PublishNugetPackages
    displayName: "Publish NuGet package artifacts"
    type: boolean
    default: false

variables:
  - template: /eng/pipelines/templates/variables/image.yml
  - template: /eng/pipelines/templates/variables/globals.yml

extends:
  template: /eng/pipelines/templates/archetype-typespec-emitter.yml
  parameters:
    InitializationSteps:
      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '22.x'
      - template: /eng/pipelines/templates/steps/install-dotnet.yml
    EmitterPackageJsonOutputPath: eng/azure-typespec-http-client-csharp-mgmt-emitter-package.json
    EmitterPackagePath: eng/packages/http-client-csharp-mgmt
    SparseCheckoutPaths:
      - /sdk/core/Azure.Core/src/Shared
      - /sdk/core/Azure.Core.TestFramework/src
      - /sdk/resourcemanager/Azure.ResourceManager/src/Shared
    BuildPrereleaseVersion: true
    UseTypeSpecNext: ${{ parameters.UseTypeSpecNext }}
    ${{ if eq(variables['System.TeamProject'], 'internal') }}:
      ${{ if eq(variables['Build.Reason'], 'Manual') }}:
        ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
          ShouldPublish: true
          ShouldRegenerate: true
          PublishPublic: true
          PublishDependsOnTest: false
          HasNugetPackages: true
        ${{ else }}:
          ShouldPublish: ${{ parameters.ShouldPublish }}
          ShouldRegenerate: ${{ parameters.ShouldRegenerate }}
          HasNugetPackages: ${{ parameters.PublishNugetPackages }}
          ${{ if startswith(variables['Build.SourceBranch'], 'refs/pull/') }}:  # PR refs can't be published to public, even in a manual run
            PublishPublic: false
            PublishDependsOnTest: false
          ${{ else }}: # Any other manual run can go to public
            PublishPublic: ${{ parameters.PublishPublic }}
            PublishDependsOnTest: ${{ parameters.PublishPublic }}
      ${{ else }}: # All automatic runs publish, but only CI of main goes public
        ShouldPublish: true
        ShouldRegenerate: true
        PublishDependsOnTest: false
        PublishPublic: ${{ and(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}
        HasNugetPackages: true
      OnlyGenerateTypespec: true
      ${{ if eq(parameters.RegenerateAllServices, true) }}:
        # Preserve the full ARM + provisioning scope and batching when requested.
        RegenerationJobCount: 18
        MinimumPerJob: 10
        DirectoryFilterPattern: 'Azure.ResourceManager*,Azure.Provisioning*'
      ${{ if eq(parameters.RegenerateAllServices, false) }}:
        # Split the priority list across up to 18 jobs.
        RegenerationJobCount: 18
        MinimumPerJob: 1
        # Source: https://gist.github.com/live1206/26f6c34be35efe04d35e8377c0962a03
        # Resources is retained in the list but skipped until it has a tsp-location.yaml.
        DirectoryFilterPattern: >-
          Azure.ResourceManager.Compute,
          Azure.ResourceManager.Network,
          Azure.ResourceManager.Storage,
          Azure.ResourceManager.KeyVault,
          Azure.ResourceManager.Sql,
          Azure.ResourceManager.AppService,
          Azure.ResourceManager.ContainerService,
          Azure.ResourceManager.Resources,
          Azure.ResourceManager.Monitor,
          Azure.ResourceManager.OperationalInsights,
          Azure.ResourceManager.ManagedServiceIdentities,
          Azure.ResourceManager.Authorization,
          Azure.ResourceManager.Dns,
          Azure.ResourceManager.PrivateDns,
          Azure.ResourceManager.TrafficManager,
          Azure.ResourceManager.ContainerRegistry,
          Azure.ResourceManager.CosmosDB,
          Azure.ResourceManager.PostgreSql,
          Azure.ResourceManager.MySql,
          Azure.ResourceManager.Redis,
          Azure.ResourceManager.EventHubs,
          Azure.ResourceManager.ServiceBus
    TestMatrix:
      All:
        TestArguments: -UnitTests -GenerationChecks -Filter .NET
        SpectorName: "http-client-csharp-mgmt"

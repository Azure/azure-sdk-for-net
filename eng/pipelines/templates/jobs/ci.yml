parameters:
  - name: Artifacts
    type: object
    default: []
  - name: TestPipeline
    type: boolean
    default: false
  - name: ArtifactName
    type: string
    default: packages
  - name: SDKType
    type: string
    default: all
  - name: ServiceDirectory
    type: string
    default: not-specified
  - name: BuildSnippets
    type: boolean
    default: true
  - name: TestSetupSteps
    type: stepList
    default: []
  - name: TestTimeoutInMinutes
    type: number
  - name: MatrixConfigs
    type: object
  - name: AdditionalMatrixConfigs
    type: object
    default: []
  - name: MatrixFilters
    type: object
    default: []
  - name: MatrixReplace
    type: object
    default: []
  - name: TestDependsOnDependency
    type: string
    default: not-specified
  - name: LimitForPullRequest
    type: boolean
    default: false
  - name: ExcludePaths
    type: object
    default: []
  - name: EnableTestCheckoutNarrowing
    type: boolean
    default: false
  - name: UseRepositorySourceGraph
    type: boolean
    default: true

jobs:
  # TEMPORARY VALIDATION BRANCH: retain the standard generator job identity, but terminate
  # after exhaustive oracle parity and publish its evidence instead of generating fan-out jobs.
  - ${{ if and(eq(parameters.ServiceDirectory, 'auto'), eq(variables['Build.Reason'], 'PullRequest')) }}:
    - job: generate_target_service_test_matrix
      displayName: Validate complete repository graph parity
      timeoutInMinutes: 180
      pool:
        name: $(LINUXPOOL)
        image: $(LINUXVMIMAGE)
        os: linux
      variables:
        - template: /eng/pipelines/templates/variables/image.yml
        - name: skipComponentGovernanceDetection
          value: true
      steps:
        - checkout: self
          fetchFilter: tree:0
          fetchTags: false

        - template: /eng/pipelines/templates/steps/install-dotnet.yml
          parameters:
            # The exhaustive restore fills the hosted agent disk; this one-shot validation has
            # no downstream job that can reuse a cache, so do not archive it after parity succeeds.
            EnableNuGetCache: false

        - pwsh: |
            $evidenceRoot = "$(Build.ArtifactStagingDirectory)/RepositoryProjectGraphParity"
            New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null

            # common.ps1 loads Language-Settings.ps1, whose .NET hook owns this validation.
            . "$(Build.SourcesDirectory)/eng/common/scripts/common.ps1"
            try {
              $provenance = Invoke-dotnet-RepositoryProjectGraphParityValidation `
                -RepositoryRoot "$(Build.SourcesDirectory)" `
                -OutputRoot $evidenceRoot

              Write-Host "CI_REPOSITORY_PROJECT_GRAPH_PARITY_RESULT=$($provenance.result)"
              Write-Host "CI_REPOSITORY_PROJECT_GRAPH_PARITY_EVIDENCE=$evidenceRoot/dependency-relation/provenance.json"
            }
            catch {
              Write-Host 'CI_REPOSITORY_PROJECT_GRAPH_PARITY_RESULT=failed'
              Write-Host "CI_REPOSITORY_PROJECT_GRAPH_PARITY_EVIDENCE=$evidenceRoot"
              throw
            }
          displayName: Validate MSBuildProjectReferenceOracle parity

        - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
          parameters:
            ArtifactName: RepositoryProjectGraphParity
            ArtifactPath: $(Build.ArtifactStagingDirectory)/RepositoryProjectGraphParity

  - ${{ if and(eq(parameters.ServiceDirectory, 'auto'), ne(variables['Build.Reason'], 'PullRequest')) }}:
    # Build matrix - larger LOC batches (1.2M) for fewer jobs and lower per-job overhead.
    - template: /eng/common/pipelines/templates/jobs/generate-job-matrix.yml
      parameters:
        GenerateJobName: generate_build_matrix
        JobTemplatePath: /eng/pipelines/templates/jobs/batched-build.yml
        Pools: # eng/pipelines/templates/stages/build-matrix.json only contains windows OS currently so only pass the Windows pool to avoid the other OS's being marked skipped in DevOps
          - name: Windows
            filter: .*Windows.*Pool$
            os: windows
        MatrixConfigs:
        - Name: NET_ci_build_base
          Path: eng/pipelines/templates/stages/build-matrix.json
          Selection: sparse
          GenerateVMJobs: true
        SparseCheckoutPaths:
          - "/*"
          - "!SessionRecords"
        EnablePRGeneration: true
        PRMatrixSetting: ProjectNames
        PRJobBatchSize: 1
        AdditionalParameters:
          Artifacts: ${{ parameters.Artifacts }}
          TestPipeline: ${{ parameters.TestPipeline }}
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          SDKType: ${{ parameters.SDKType }}
          BuildSnippets: ${{ parameters.BuildSnippets }}
        PreGenerationSteps:
          - template: /eng/pipelines/templates/steps/pr-matrix-presteps.yml
            parameters:
              ServiceDirectory: ${{ parameters.ServiceDirectory }}
              PublishingArtifactName: BuildPackagesArtifact
              ForceDirect: true
              ExcludePaths: ${{ parameters.ExcludePaths }}
              EnableLocWeighting: true
              LocTarget: 1200000
              PublishArtifact: true

    # Analyze matrix - smaller LOC batches (300k) for more parallelism so analyze wall-clock matches build.
    - template: /eng/common/pipelines/templates/jobs/generate-job-matrix.yml
      parameters:
        GenerateJobName: generate_analyze_matrix
        JobTemplatePath: /eng/pipelines/templates/jobs/batched-analyze.yml
        Pools: # build-matrix.json only contains Windows entries; batched-analyze.yml overrides pool to Linux internally.
          - name: Windows
            filter: .*Windows.*Pool$
            os: windows
        MatrixConfigs:
        - Name: NET_ci_analyze_base
          Path: eng/pipelines/templates/stages/build-matrix.json
          Selection: sparse
          GenerateVMJobs: true
        SparseCheckoutPaths:
          - "/*"
          - "!SessionRecords"
        EnablePRGeneration: true
        PRMatrixSetting: ProjectNames
        PRJobBatchSize: 1
        AdditionalParameters:
          Artifacts: ${{ parameters.Artifacts }}
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          SDKType: ${{ parameters.SDKType }}
          BuildSnippets: ${{ parameters.BuildSnippets }}
          ArtifactName: AnalyzePackageInfoArtifact
        PreGenerationSteps:
          - template: /eng/pipelines/templates/steps/pr-matrix-presteps.yml
            parameters:
              ServiceDirectory: ${{ parameters.ServiceDirectory }}
              PublishingArtifactName: AnalyzePackageInfoArtifact
              ForceDirect: true
              ExcludePaths: ${{ parameters.ExcludePaths }}
              EnableLocWeighting: true
              LocTarget: 300000
              PublishArtifact: true

  - ${{ if ne(parameters.ServiceDirectory, 'auto') }}:
    - job: Build
      pool:
        name: $(WINDOWSPOOL)
        image: $(WINDOWSVMIMAGE)
        os: windows

      variables:
      - name: SDKType
        value: ${{ parameters.SDKType }}

      # Only run CG and codeql on internal build job
      ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        templateContext:
          sdl:
            componentgovernance:
              enabled: true
            codeql:
              # Need to specify the language because we clone after the codeql initialize step
              language: csharp, javascript, python
              compiled:
                enabled: true

      steps:
        - template: /eng/pipelines/templates/steps/build.yml
          parameters:
            Artifacts: ${{ parameters.Artifacts }}
            TestPipeline: ${{ parameters.TestPipeline }}
            ServiceDirectory: ${{ parameters.ServiceDirectory }}
            SDKType: ${{ parameters.SDKType }}

    - job: "Analyze"
      timeoutInMinutes: ${{ parameters.TestTimeoutInMinutes }}
      condition: and(succeededOrFailed(), ne(variables['Skip.Analyze'], true))
      pool:
        name: $(LINUXPOOL)
        image: $(LINUXVMIMAGE)
        os: linux

      steps:
        - template: /eng/pipelines/templates/steps/analyze.yml
          parameters:
            Artifacts: ${{ parameters.Artifacts }}
            ServiceDirectory: ${{ parameters.ServiceDirectory }}
            SDKType: ${{ parameters.SDKType }}
            BuildSnippets: ${{ parameters.BuildSnippets }}

  # For some pipelines like mgmt which are tested in aggregate we want to limit the pipeline to no tests or
  # other stages that are aggregate in nature as those are tested in another aggregate pipeline
  - ${{ if and(or(ne(variables['Build.Reason'], 'PullRequest'), ne(parameters.LimitForPullRequest, 'true')), not(and(eq(parameters.ServiceDirectory, 'auto'), eq(variables['Build.Reason'], 'PullRequest')))) }}:
    - job: Compliance
      pool:
        name: $(WINDOWSPOOL)
        image: $(WINDOWSVMIMAGE)
        os: windows
      steps:
        - checkout: self
          fetchFilter: tree:0
          fetchTags: false

        - task: UsePythonVersion@0
          displayName: "Use Python 3.11"
          inputs:
            versionSpec: "3.11"

        - template: /eng/common/pipelines/templates/steps/validate-filename.yml

        - template: /eng/common/pipelines/templates/steps/check-spelling.yml
          parameters:
            ScriptToValidateUpgrade: eng/scripts/spell-check-public-api.ps1

        - template: /eng/common/pipelines/templates/steps/verify-path-length.yml
          parameters:
            SourceDirectory: $(Build.SourcesDirectory)

        - template: /eng/common/pipelines/templates/steps/verify-codeowners-sections.yml
          parameters:
            Sections:
              - 'Client Libraries'

        - template: /eng/common/pipelines/templates/steps/eng-common-workflow-enforcer.yml

        # This job does not otherwise use the .NET SDK, so it does not inherit the install from
        # /eng/pipelines/templates/steps/install-dotnet.yml. The agent image does not yet carry the
        # SDK version specified by global.json, so install it here for the NoWarn validation. This
        # step can be removed once the agent version satisfies global.json.
        - task: UseDotNet@2
          displayName: 'Use .NET SDK'
          retryCountOnTaskFailure: 3
          inputs:
            useGlobalJson: true
            performMultiLevelLookup: true

        - pwsh: ./eng/scripts/Test-NoWarnValidation.ps1
          displayName: Validate NoWarn enforcement targets

    - template: /eng/common/pipelines/templates/jobs/generate-job-matrix.yml
      parameters:
        GenerateJobName: generate_target_service_test_matrix
        JobTemplatePath: /eng/pipelines/templates/jobs/ci.tests.yml
        MatrixConfigs: ${{ parameters.MatrixConfigs }}
        MatrixFilters: ${{ parameters.MatrixFilters }}
        MatrixReplace: ${{ parameters.MatrixReplace }}
        CloudConfig:
          Cloud: public
        ${{ if eq(parameters.ServiceDirectory, 'auto') }}:
          SparseCheckoutPaths:
            - "/*"
            - "!SessionRecords"
          EnablePRGeneration: true
          PRMatrixSetting: ProjectNames
          # Runtime weighting first creates small balanced buckets. Linux and Windows
          # combine three buckets while slower macOS keeps one bucket per job. If
          # runtime weighting fails, the presteps retain count-based batching.
          PRJobBatchSize: 10
          PRJobBatchSizeByPool:
            Linux: $(TestMatrixEntriesPerJobLinux)
            Windows: $(TestMatrixEntriesPerJobWindows)
            Mac: $(TestMatrixEntriesPerJobMac)
          PRMatrixIndirectFilters:
            - 'AdditionalTestArguments=.*true'
            - 'Pool=.*LinuxPool$'
          PreGenerationSteps:
            - template: /eng/pipelines/templates/steps/pr-matrix-presteps.yml
              parameters:
                ServiceDirectory: ${{ parameters.ServiceDirectory }}
                PublishingArtifactName: TestPackagesArtifact
                ExcludePaths: ${{ parameters.ExcludePaths }}
                EnableTestCheckoutNarrowing: ${{ parameters.EnableTestCheckoutNarrowing }}
                EnableTestRuntimeWeighting: true
                UseRepositorySourceGraph: ${{ parameters.UseRepositorySourceGraph }}

        AdditionalParameters:
          SDKType: ${{ parameters.SDKType }}
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          TestSetupSteps: ${{ parameters.TestSetupSteps }}
          TestTimeoutInMinutes: ${{ parameters.TestTimeoutInMinutes }}
          ${{ if eq(parameters.ServiceDirectory, 'auto') }}:
            EnableTestCheckoutNarrowing: ${{ parameters.EnableTestCheckoutNarrowing }}

  - ${{ if and(ne(parameters.TestDependsOnDependency, 'not-specified'), not(and(eq(parameters.ServiceDirectory, 'auto'), eq(variables['Build.Reason'], 'PullRequest')))) }}:
    - template: /eng/common/pipelines/templates/jobs/generate-job-matrix.yml
      parameters:
        GenerateJobName: generate_target_dependencies_test_matrix
        JobTemplatePath: /eng/pipelines/templates/jobs/ci.tests.yml
        MatrixConfigs: ${{ parameters.MatrixConfigs }}
        MatrixFilters: ${{ parameters.MatrixFilters }}
        MatrixReplace:
          # Force UseProjectReferenceToAzureClients option to always be true because we only want to test with ProjectReference for dependency tests
          - AdditionalTestArguments=\/p:UseProjectReferenceToAzureClients\=false/\/p:UseProjectReferenceToAzureClients\=true
          - ${{ each matrixReplace in parameters.MatrixReplace }}:
              - ${{ matrixReplace }}
        CloudConfig:
          Cloud: public
        SparseCheckoutPaths:
          - /*
          - '!/sdk/*/**/SessionRecords/*'
        PreGenerationSteps:
          - ${{ each config in parameters.MatrixConfigs }}:
              - template: /eng/pipelines/templates/steps/dependency.tests.yml
                parameters:
                  TestDependsOnDependency: ${{ parameters.TestDependsOnDependency }}
                  # The value for ProjectListOverrideFilePropertyName should be the same as AdditionalParameters ProjectListOverrideFilePropertyName below
                  ProjectListOverrideFilePropertyName: 'ProjectListOverrideFile'
                  ProjectFilesOutputFolder: $(Build.ArtifactStagingDirectory)
                  ExcludeTargetTestProjects: true
                  ServiceDirectory: ${{ parameters.ServiceDirectory }}
                  MatrixConfigsFile: ${{ config.Path }}
        AdditionalParameters:
          SDKType: ${{ parameters.SDKType }}
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          TestSetupSteps: ${{ parameters.TestSetupSteps }}
          TestTimeoutInMinutes: ${{ parameters.TestTimeoutInMinutes }}
          # The value for ProjectListOverrideFilePropertyName should be the same as dependency.tests.yml parameter ProjectListOverrideFilePropertyName
          ProjectListOverrideFilePropertyName: 'ProjectListOverrideFile'

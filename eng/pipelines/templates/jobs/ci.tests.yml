parameters:
  - name: SDKType
    type: string
    default: all
  - name: TestSetupSteps
    type: stepList
    default: []
  - name: TestTimeoutInMinutes
    type: number
  - name: Matrix
    type: string
  - name: DependsOn
    type: string
    default: ''
  - name: UsePlatformContainer
    type: boolean
    default: false
  - name: CloudConfig
    type: object
    default: {}
  - name: ProjectListOverrideFilePropertyName
    type: string
    default: ''
  - name: ServiceDirectory
    type: string
    default: ''
  - name: OSName
    type: string
  - name: EnableTestCheckoutNarrowing
    type: boolean
    default: false
  - name: EnableTestRuntimeTrimming
    type: boolean
    default: false

jobs:
  - job:
    displayName: "Test"
    dependsOn: ${{ parameters.DependsOn }}
    timeoutInMinutes: ${{ parameters.TestTimeoutInMinutes }}
    condition: and(succeededOrFailed(), ne(variables['Skip.Test'], true), ne(${{ parameters.Matrix }}, '{}'))
    strategy:
      matrix: $[ ${{ parameters.Matrix }} ]

    pool:
      # 1es pipeline templates converts `image` to demands: ImageOverride under the hood
      # which is incompatible with image selection in the default non-1es hosted pools
      ${{ if eq(parameters.OSName, 'macOS') }}:
        vmImage: $(OSVmImage)
      ${{ else }}:
        image: $(OSVmImage)
      name: $(Pool)
      os: ${{ parameters.OSName }}
    ${{ if eq(parameters.UsePlatformContainer, 'true') }}:
      # Add a default so the job doesn't fail when the matrix is empty
      container: $[ variables['Container'] ]

    variables:
      ${{ if eq(parameters.ServiceDirectory, 'auto') }}:
        ServiceDirectory: '*'
      ${{ else }}:
        ServiceDirectory: ${{ parameters.ServiceDirectory }}

    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/test.binlog
          artifactName: binlog_$(Agent.JobName)
          condition: and(ne(variables['DiagnosticArguments'], ''), eq(variables['System.Debug'], 'true'))
          sbomEnabled: false
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/artifacts
          artifactName: artifacts_$(Agent.JobName)
          condition: and(ne(variables['DiagnosticArguments'], ''), eq(variables['System.Debug'], 'true'))
          sbomEnabled: false
        # See eng/pipelines/templates/steps/upload-dumps.yml for corresponding file copy step
        - output: pipelineArtifact
          targetPath: '$(Build.ArtifactStagingDirectory)/dumps.zip'
          artifactName: "Crash Dump - $(System.JobName) - $(System.JobAttempt)"
          condition: eq(variables['uploadDump'], 'true')
          sbomEnabled: false
        # See eng/common/pipelines/templates/steps/upload-llm-artifacts.yml for corresponding file copy step
        - output: pipelineArtifact
          targetPath: '$(Build.ArtifactStagingDirectory)/llm-artifacts'
          artifactName: "LLM Artifacts - $(System.JobName) - $(System.JobAttempt)"
          condition: eq(variables['uploadLlmArtifacts'], 'true')
          sbomEnabled: false

    steps:
      - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml

      - ${{ if parameters.EnableTestCheckoutNarrowing }}:
        # The checkout map has to be resolved before the repository exists on disk, so
        # it travels in the same artifact as the batched PackageInfo files and the
        # resolver is inlined here. This mirrors why sparse-checkout.yml inlines its
        # own script. eng/scripts/Get-TestCheckoutPaths.ps1 does the real work during
        # matrix generation, where a full checkout is available.
        - task: DownloadPipelineArtifact@2
          displayName: Download test checkout map
          condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
          continueOnError: true
          inputs:
            artifact: TestPackagesArtifact
            patterns: "**/checkout-map.json"
            path: $(Agent.TempDirectory)/TestCheckoutMap

        - pwsh: |
            $fallback = @('/*', '!SessionRecords', '/sdk/*/**/SessionRecords/*')

            function Set-Paths([string[]] $paths, [string] $reason) {
              $json = $paths | ConvertTo-Json -Compress -AsArray
              Write-Host "Sparse checkout paths ($reason): $($paths -join ' ')"
              Write-Host "##vso[task.setvariable variable=TestSparseCheckoutPaths]$json"
            }

            # The map artifact download runs with continueOnError, so the directory may
            # not exist at all. Test first and suppress non-terminating errors so the
            # fallback stays quiet even if the task is configured to fail on stderr.
            $mapDirectory = "$(Agent.TempDirectory)/TestCheckoutMap"
            if (-not (Test-Path -LiteralPath $mapDirectory)) {
              Set-Paths $fallback 'checkout map artifact was not downloaded'
              return
            }

            $map = Get-ChildItem -Path $mapDirectory -Filter checkout-map.json -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $map) {
              Set-Paths $fallback 'no checkout map available'
              return
            }

            $artifacts = @('$(ProjectNames)' -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($artifacts.Count -eq 0) {
              Set-Paths $fallback 'no batch package names'
              return
            }

            # The always-included paths (base sparse-checkout patterns, every non-sdk
            # top level directory, and the services that projects reach without naming
            # them in a .csproj) are recorded in the map by Get-TestCheckoutPaths.ps1.
            # They are deliberately NOT repeated here: this resolver runs before the
            # repository is on disk so it cannot dot-source that script, and keeping a
            # second copy of the list previously caused a build break when only one
            # copy was updated.
            $lookup = @{}
            foreach ($property in (Get-Content -LiteralPath $map.FullName -Raw | ConvertFrom-Json).PSObject.Properties) {
              $lookup[$property.Name] = @($property.Value)
            }

            $alwaysKey = '$alwaysIncludedPaths'
            if (-not $lookup.ContainsKey($alwaysKey)) {
              Set-Paths $fallback 'checkout map has no always-included path list'
              return
            }

            $paths = [System.Collections.Generic.List[string]]@($lookup[$alwaysKey])
            $services = [System.Collections.Generic.SortedSet[string]]::new()

            foreach ($artifact in $artifacts) {
              if ($artifact -eq $alwaysKey -or -not $lookup.ContainsKey($artifact)) {
                # A stale map would silently drop a service and turn into a build error
                # rather than a slow job, so fall back to checking out everything.
                Set-Paths $fallback "no map entry for '$artifact'"
                return
              }
              if (@($lookup[$artifact]).Count -eq 0) {
                # An empty entry means the map builder could not analyse that package
                # exactly, so narrowing on it would drop services the build needs.
                Set-Paths $fallback "empty map entry for '$artifact'"
                return
              }
              foreach ($service in $lookup[$artifact]) { $null = $services.Add($service) }
            }

            foreach ($service in $services) {
              $candidate = "/sdk/$service/*"
              if (-not $paths.Contains($candidate)) { $paths.Add($candidate) }
            }
            Set-Paths $paths "$($artifacts.Count) packages -> $($services.Count) services"
          displayName: Resolve test checkout paths
          condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))

      - ${{ if not(contains(variables['Build.DefinitionName'], '-pr - ')) }}:
        - ${{ if parameters.EnableTestCheckoutNarrowing }}:
          - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
            parameters:
              Paths: $(TestSparseCheckoutPaths)

        - ${{ if not(parameters.EnableTestCheckoutNarrowing) }}:
          - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
            parameters:
              # we only need to checkout all sdk directories for All PR builds OR the
              # deprecating AdditionalDependency leg of the core/resource builds. ProjectListOverrideFilePropertyName will be set in the latter case.
              ${{ if and(ne(parameters.ServiceDirectory, 'auto'), eq(parameters.ProjectListOverrideFilePropertyName, '')) }}:
                Paths:
                  - "/*"
                  - "!SessionRecords"
                  - "/sdk/${{ parameters.ServiceDirectory }}/**/SessionRecords/*"
              ${{ else }}:
                Paths:
                  - "/*"
                  - "!SessionRecords"
                  - "/sdk/*/**/SessionRecords/*"

      - ${{ if ne(parameters.ProjectListOverrideFilePropertyName, '') }}:
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: DependencyTestProjectReferences
            patterns: "**/$(${{ parameters.ProjectListOverrideFilePropertyName }})"
            path: $(Build.SourcesDirectory)
      - ${{ if and(eq(variables['Build.Reason'], 'PullRequest'), eq(parameters.ServiceDirectory, 'auto')) }}:
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: TestPackagesArtifact
            path: $(Build.SourcesDirectory)/PackageInfo

      - pwsh: |
          $(Build.SourcesDirectory)/eng/common/scripts/trust-proxy-certificate.ps1
        displayName: 'Language Specific Certificate Trust'

      - pwsh: |
          Write-Host "##vso[task.setvariable variable=ASPNETCORE_Kestrel__Certificates__Default__Path]$(Build.SourcesDirectory)/eng/common/testproxy/dotnet-devcert.pfx"
          Write-Host "##vso[task.setvariable variable=ASPNETCORE_Kestrel__Certificates__Default__Password]password"
        displayName: 'Configure Kestrel Environment Variables'

      - template: /eng/common/pipelines/templates/steps/verify-agent-os.yml
        parameters:
          AgentImage: ${{ parameters.OSName }}

      - ${{ each step in parameters.TestSetupSteps }}:
        - ${{ each pair in step }}:
            ${{ pair.key }}: ${{ pair.value }}

      - template: /eng/pipelines/templates/steps/install-dotnet.yml
        parameters:
          NuGetCacheKey: Test
          SkipUnusedTestRuntimes: ${{ parameters.EnableTestRuntimeTrimming }}

      # this section is only included when invoking with a dynamic set of packages (EG net - pullrequest)
      - ${{ if and(eq(variables['Build.Reason'], 'PullRequest'), eq(parameters.ServiceDirectory, 'auto')) }}:
        - template: /eng/pipelines/templates/steps/set-artifact-packages.yml
          parameters:
            PackageInfo: '$(Build.SourcesDirectory)/PackageInfo'
            Restore: true

        - pwsh: |
            if ("$(ProjectNames)" -like "*storage*") {
              &"$(Build.SourcesDirectory)/eng/scripts/Install-Azurite.ps1" -AzuriteLocation "$(AzuriteLocation)" -AzuriteVersion "$(AzuriteVersion)"
            }
          displayName: Install Azurite If Necessary
          condition: ne(variables['ProjectNames'], '')

      # ProjectListOverrideFile is set by the customization within dependency.tests.yml
      # OR it is set by the PR built to target a set of packages outside of a single target service directory.
      # if it is unset, then we are in a traditional service directory build.
      - pwsh: |
          if ($env:PROJECTLISTOVERRIDEFILE) {
            Write-Host "##vso[task.setvariable variable=CodeCoverageFilePattern]$(Build.SourcesDirectory)/sdk/**/coverage.cobertura.xml"
          }
          else
          {
            # we aren't running in net - pullrequest, so we need to ensure the value is set to empty string
            Write-Host "##vso[task.setvariable variable=ProjectListOverrideFile]"
            Write-Host "##vso[task.setvariable variable=CodeCoverageFilePattern]$(Build.SourcesDirectory)/sdk/$(ServiceDirectory)/**/coverage.cobertura.xml"
          }
        displayName: Set variable for the project list file and coverage directory

      - template: /eng/pipelines/templates/steps/dotnet-diagnostics.yml
        parameters:
          LogFilePath: $(Build.ArtifactStagingDirectory)/test.binlog

      - pwsh: |
          dotnet tool restore

      - pwsh: >
          ./eng/scripts/runwithdevopslogging.ps1
          dotnet test eng/service.proj
          --filter '"(TestCategory!=Manually) & (TestCategory!=Live) & ($(AdditionalTestFilters))"'
          --framework $(TestTargetFramework)
          --logger '"trx;LogFileName=$(TestTargetFramework).trx"' --logger:'"console;verbosity=normal"'
          --blame-crash-dump-type full --blame-hang-dump-type full --blame-hang-timeout ${{parameters.TestTimeoutInMinutes}}minutes
          /p:SDKType=${{ parameters.SDKType }}
          /p:ServiceDirectory=$(ServiceDirectory)
          /p:IncludeSrc=false /p:IncludeSamples=false /p:IncludePerf=false /p:IncludeStress=false /p:IncludeIntegrationTests=false
          /p:RunApiCompat=false /p:InheritDocEnabled=false
          /p:Configuration=$(BuildConfiguration)
          /p:CollectCoverage=$(CollectCoverage)
          /p:EnableSourceLink=false
          /p:ProjectListOverrideFile=$(ProjectListOverrideFile)
          /p:EnableOverrideExclusions=true
          $(AdditionalTestArguments)
          $(DiagnosticArguments)
        displayName: "Build & Test ($(TestTargetFramework))"

      - task: PublishTestResults@2
        condition: always()
        displayName: "Publish Results ($(TestTargetFramework))"
        inputs:
          testResultsFiles: "**/$(TestTargetFramework)*.trx"
          testRunTitle: "${{ parameters.OSName }} $(TestTargetFramework)"
          testResultsFormat: "VSTest"
          mergeTestResults: true
      - template: /eng/pipelines/templates/steps/upload-dumps.yml
      - template: /eng/common/pipelines/templates/steps/upload-llm-artifacts.yml
        parameters:
          TestResultsGlob: '$(TestTargetFramework)*.trx'
      - task: Palmmedia.reportgenerator.reportgenerator-build-release-task.reportgenerator@5
        condition: and(succeededOrFailed(), eq(variables['CollectCoverage'], 'true'), eq(variables['coverage.collected'], 'true'))
        displayName: Generate Code Coverage Reports
        inputs:
          reports: $(CodeCoverageFilePattern)
          targetdir: $(Build.ArtifactStagingDirectory)/coverage
          reporttypes: Cobertura
          filefilters: +$(Build.SourcesDirectory)/sdk/$(ServiceDirectory)/**
          verbosity: Verbose
      - task: PublishCodeCoverageResults@2
        condition: and(succeededOrFailed(), eq(variables['CollectCoverage'], 'true'), eq(variables['coverage.collected'], 'true'))
        displayName: Publish Code Coverage Reports
        inputs:
          summaryFileLocation: $(Build.ArtifactStagingDirectory)\coverage\Cobertura.xml

parameters:
  - name: PublishingArtifactName
    type: string
  - name: ServiceDirectory
    type: string
  - name: ForceDirect
    type: boolean
    default: false
  - name: ExcludePaths
    type: object
    default: []
  - name: EnableLocWeighting
    type: boolean
    default: false
  - name: LocTarget
    type: number
    default: 474000
  - name: LocBaseCost
    type: number
    default: 0
  - name: PublishArtifact
    type: boolean
    default: true
  - name: EnableTestDependencyGraphCache
    type: boolean
    default: false
  - name: EnableTestWeighting
    type: boolean
    default: false
  - name: TestPackagesPerJob
    type: number
    default: 10
  - name: DefaultMatrixConfigs
    type: object
    default: []

steps:
  - template: /eng/pipelines/templates/steps/install-dotnet.yml

  - ${{ if eq(parameters.EnableTestDependencyGraphCache, true) }}:
    - pwsh: |
        git ls-files -s -- global.json "*.csproj" "*.props" "*.targets" "*.proj" "*.projects" `
          | Sort-Object `
          | Set-Content "$(Build.ArtifactStagingDirectory)/test-dependency-graph-key.txt"
      displayName: Create test dependency graph cache key

    - task: Cache@2
      inputs:
        key: 'dotnet-test-dependency-graph-v1 | "$(Agent.OS)" | $(Build.ArtifactStagingDirectory)/test-dependency-graph-key.txt'
        path: $(Pipeline.Workspace)/dotnet-test-dependency-graph
        cacheHitVar: TEST_DEPENDENCY_GRAPH_CACHE_RESTORED
      continueOnError: true
      displayName: Cache test dependency graph

    - pwsh: |
        $graphPath = "$(Pipeline.Workspace)/dotnet-test-dependency-graph/graph.txt"
        Write-Host "Test dependency graph cache restored: $(TEST_DEPENDENCY_GRAPH_CACHE_RESTORED)"
        Write-Host "##vso[task.setvariable variable=AZURESDK_TEST_DEPENDENCY_GRAPH_PATH;]$graphPath"
      displayName: Configure test dependency graph

  # When ForceDirect is set, every indirect package discovered below is deleted before matrix
  # generation, and downstream jobs filter the published artifact down to the batch's
  # ProjectNames. Computing the cross-package dependency graph (a full-repo MSBuild
  # restore+evaluation, ~3.5 min) is therefore pure waste for these passes, so turn it off.
  - ${{ if eq(parameters.ForceDirect, true) }}:
    - pwsh: |
        Write-Host "##vso[task.setvariable variable=AZURESDK_SKIP_DEPENDENT_PACKAGE_CALCULATION;]true"
      displayName: Skip dependent package calculation (direct packages only)

  - template: /eng/common/pipelines/templates/steps/save-package-properties.yml
    parameters:
      ServiceDirectory: ${{parameters.ServiceDirectory}}
      PackageInfoDirectory: $(Build.ArtifactStagingDirectory)/PackageInfoPublishing
      ExcludePaths: ${{ parameters.ExcludePaths }}

  # when we publish the packageinfo as an artifact, it actually cleans up the original files. Since we need them during matrix generation steps
  # that will execute directly after the pregeneration steps here, we output them to a publishing directory, copy from there into the target PackageInfoDirectory,
  # and then publish the originals
  - pwsh: |
      mkdir "$(Build.ArtifactStagingDirectory)/PackageInfo"
      Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfoPublishing" -File `
        | Copy-Item -Destination "$(Build.ArtifactStagingDirectory)/PackageInfo/$($_.Name)" -Force
    displayName: Copy ArtifactInfo from Publishing Directory

  - ${{ if eq(parameters.PublishArtifact, true) }}:
    - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
      parameters:
        ArtifactName: '${{ parameters.PublishingArtifactName }}'
        ArtifactPath: '$(Build.ArtifactStagingDirectory)/PackageInfoPublishing'

  - pwsh: |
      $packageInfos = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfo" -Filter "*.json" -Recurse `
        | ForEach-Object { Get-Content $_.FullName | ConvertFrom-Json }

      $directPackages = $packageInfos | Where-Object { $_.IncludedForValidation -eq $false }

      if (!$directPackages) {
        Write-Host "Falling back to Azure.Template from the original package list. There are no other direct packages for assembly."

        # grab just the Azure.Template package from the original list, set it to direct
        Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfo" -Filter "Azure.Template.json" -Recurse |
          ForEach-Object {
            $json = Get-Content $_.FullName | ConvertFrom-Json
            $json.IncludedForValidation = $false
            $json | ConvertTo-Json -Depth 100 | Set-Content $_.FullName
          }
      }

      # remove all the indirect packages from the list of packages that we want to generate matrix for
      Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfo" -Filter "*.json" -Recurse |
        ForEach-Object {
          $json = Get-Content $_.FullName | ConvertFrom-Json
          if ($json.IncludedForValidation -eq $true) {
            Remove-Item $_.FullName -Force
          }
        }
    displayName: Only target direct packages for build and test
    condition: and(succeededOrFailed(), eq(${{ parameters.ForceDirect }}, true))

  - ${{ if eq(parameters.EnableLocWeighting, true) }}:
    - pwsh: |
        eng/scripts/Get-PackageLocWeights.ps1 `
          -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
          -RepoRoot "$(Build.SourcesDirectory)" `
          -OutputFile "$(Build.ArtifactStagingDirectory)/loc-weights.json"
      displayName: Count LOC per package for build/analyze weighting
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))

    - pwsh: |
        eng/scripts/Apply-WeightedBatching.ps1 `
          -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
          -WeightsFile "$(Build.ArtifactStagingDirectory)/loc-weights.json" `
          -Target ${{ parameters.LocTarget }} `
          -BaseCost ${{ parameters.LocBaseCost }}
      displayName: Apply LOC-weighted batching (target ${{ parameters.LocTarget }}, base cost ${{ parameters.LocBaseCost }})
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))

  - ${{ if eq(parameters.EnableTestWeighting, true) }}:
    - pwsh: |
        '${{ convertToJson(parameters.DefaultMatrixConfigs) }}' `
          | Set-Content "$(Build.ArtifactStagingDirectory)/default-test-matrix-configs.json"
      displayName: Save default test matrix configs

    - pwsh: |
        eng/scripts/Get-PackageTestWeights.ps1 `
          -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
          -RepoRoot "$(Build.SourcesDirectory)" `
          -OutputFile "$(Build.ArtifactStagingDirectory)/test-weights.json"
      displayName: Estimate package test cost
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))

    - pwsh: |
        eng/scripts/Apply-WeightedBatching.ps1 `
          -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
          -WeightsFile "$(Build.ArtifactStagingDirectory)/test-weights.json" `
          -PackagesPerBatch ${{ parameters.TestPackagesPerJob }} `
          -DefaultMatrixConfigsFile "$(Build.ArtifactStagingDirectory)/default-test-matrix-configs.json"
      displayName: Apply test-weighted batching (${{ parameters.TestPackagesPerJob }} packages/job)
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))

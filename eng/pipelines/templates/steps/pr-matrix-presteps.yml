parameters:
  - name: PublishingArtifactName
    type: string
  - name: ServiceDirectory
    type: string
  - name: ForceDirect
    type: boolean
    default: false
  - name: ExcludePaths
    type: object
    default: []
  - name: EnableLocWeighting
    type: boolean
    default: false
  - name: EnableTestRuntimeWeighting
    type: boolean
    default: false
  - name: LocTarget
    type: number
    default: 474000
  - name: PublishArtifact
    type: boolean
    default: true
  - name: EnableTestCheckoutNarrowing
    type: boolean
    default: false

steps:
  - template: /eng/pipelines/templates/steps/install-dotnet.yml

  # ForceDirect removes indirect packages before matrix generation, so avoid calculating them.
  - ${{ if eq(parameters.ForceDirect, true) }}:
    - pwsh: |
        Write-Host "##vso[task.setvariable variable=AZURESDK_SKIP_DEPENDENT_PACKAGE_CALCULATION;]true"
      displayName: Skip dependent package calculation (direct packages only)

  - template: /eng/common/pipelines/templates/steps/save-package-properties.yml
    parameters:
      ServiceDirectory: ${{parameters.ServiceDirectory}}
      PackageInfoDirectory: $(Build.ArtifactStagingDirectory)/PackageInfoPublishing
      ExcludePaths: ${{ parameters.ExcludePaths }}

  # when we publish the packageinfo as an artifact, it actually cleans up the original files. Since we need them during matrix generation steps
  # that will execute directly after the pregeneration steps here, we output them to a publishing directory, copy from there into the target PackageInfoDirectory,
  # and then publish the originals
  - pwsh: |
      mkdir "$(Build.ArtifactStagingDirectory)/PackageInfo"
      Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfoPublishing" -File `
        | Copy-Item -Destination "$(Build.ArtifactStagingDirectory)/PackageInfo/$($_.Name)" -Force
    displayName: Copy ArtifactInfo from Publishing Directory

  - ${{ if parameters.EnableTestCheckoutNarrowing }}:
    - pwsh: |
        $graphDirectory = "$(Build.ArtifactStagingDirectory)/RepositoryProjectGraph"
        $graphPath = "$graphDirectory/repository-project-graph.json"
        dotnet msbuild /m /nr:false /nologo /tl:off `
          /t:GenerateRepositoryProjectGraphWithProjectGraph ./eng/service.proj `
          /p:RepositoryProjectGraphReaderPath="$graphPath" `
          /p:RepositoryProjectGraphReaderRecordsPath="$graphDirectory/project.records" `
          /p:RepositoryProjectGraphPackageRecordsPath="$graphDirectory/package.records" `
          /p:RepositoryProjectGraphNuGetRestoreDirectory="$graphDirectory/nuget-restore" `
          /p:RepositoryProjectGraphPackageResolutionMode=NuGetRestore `
          /p:RepositoryProjectGraphConfigurations=Debug%3BRelease `
          /p:SkipServiceProjectImports=true `
          /p:IncludeRepositoryProjectGraphInputs=true
        if ($LASTEXITCODE -ne 0) {
          throw "RepositoryProjectGraph generation failed with exit code $LASTEXITCODE."
        }

        ./eng/scripts/Create-SparseCheckoutMap.ps1 `
          -PackageInfoDirectory "$(Build.ArtifactStagingDirectory)/PackageInfo" `
          -RepoRoot "$(Build.SourcesDirectory)" `
          -GraphPath $graphPath `
          -OutputPath "$(Build.ArtifactStagingDirectory)/TestCheckoutMap/checkout-map.json"

        Copy-Item ./eng/scripts/Resolve-SparseCheckoutPaths.ps1 `
          "$(Build.ArtifactStagingDirectory)/TestCheckoutMap/Resolve-SparseCheckoutPaths.ps1"
      displayName: Build ProjectGraph test checkout map

    - ${{ if eq(parameters.PublishArtifact, true) }}:
      - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
        parameters:
          ArtifactName: TestCheckoutMap
          ArtifactPath: $(Build.ArtifactStagingDirectory)/TestCheckoutMap

  - ${{ if eq(parameters.PublishArtifact, true) }}:
    - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
      parameters:
        ArtifactName: '${{ parameters.PublishingArtifactName }}'
        ArtifactPath: '$(Build.ArtifactStagingDirectory)/PackageInfoPublishing'

  - pwsh: |
      $packageInfos = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfo" -Filter "*.json" -Recurse `
        | ForEach-Object { Get-Content $_.FullName | ConvertFrom-Json }

      $directPackages = $packageInfos | Where-Object { $_.IncludedForValidation -eq $false }

      if (!$directPackages) {
        Write-Host "Falling back to Azure.Template from the original package list. There are no other direct packages for assembly."

        # grab just the Azure.Template package from the original list, set it to direct
        Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfo" -Filter "Azure.Template.json" -Recurse |
          ForEach-Object {
            $json = Get-Content $_.FullName | ConvertFrom-Json
            $json.IncludedForValidation = $false
            $json | ConvertTo-Json -Depth 100 | Set-Content $_.FullName
          }
      }

      # remove all the indirect packages from the list of packages that we want to generate matrix for
      Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfo" -Filter "*.json" -Recurse |
        ForEach-Object {
          $json = Get-Content $_.FullName | ConvertFrom-Json
          if ($json.IncludedForValidation -eq $true) {
            Remove-Item $_.FullName -Force
          }
        }
    displayName: Only target direct packages for build and test
    condition: and(succeededOrFailed(), eq(${{ parameters.ForceDirect }}, true))

  - ${{ if eq(parameters.EnableTestRuntimeWeighting, true) }}:
    - pwsh: |
        $weightsFile = "$(Build.ArtifactStagingDirectory)/test-weights.json"
        Remove-Item $weightsFile -Force -ErrorAction SilentlyContinue

        # Direct and indirect packages are batched separately. Neither group benefits from
        # runtime weighting unless it contains at least two packages to distribute.
        $packageInfos = @(
          Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/PackageInfo" -Filter "*.json" -File -Recurse |
            ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json }
        )
        $directPackageCount = @($packageInfos | Where-Object { $_.IncludedForValidation -eq $false }).Count
        $indirectPackageCount = @($packageInfos | Where-Object { $_.IncludedForValidation -eq $true }).Count
        if ($directPackageCount -le 1 -and $indirectPackageCount -le 1) {
          Write-Host "Runtime-weighted batching is unnecessary for $directPackageCount direct and $indirectPackageCount indirect package(s). Using count-based batching."
          return
        }

        try {
          eng/scripts/Get-TestAssemblyWeights.ps1 `
            -RepoRoot "$(Build.SourcesDirectory)" `
            -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
            -OutputFile $weightsFile
        }
        catch {
          $reason = $_.Exception.Message -replace "`r?`n", " "
          Write-Host "##vso[task.logissue type=warning]Runtime-weighted test batching could not be applied: $reason Falling back to count-based test batching (10 packages per job)."
          Remove-Item $weightsFile -Force -ErrorAction SilentlyContinue
        }
      displayName: Query test assembly runtimes for balanced batching
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - pwsh: |
        $weightsFile = "$(Build.ArtifactStagingDirectory)/test-weights.json"
        if (Test-Path $weightsFile) {
          eng/scripts/Apply-WeightedBatching.ps1 `
            -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
            -WeightsFile $weightsFile `
            -Target 240

          # PackageInfo entries now represent weighted buckets. Slower macOS runs one
          # bucket per job, while Linux and Windows amortize setup over three buckets.
          Write-Host "##vso[task.setvariable variable=TestMatrixEntriesPerJobLinux]3"
          Write-Host "##vso[task.setvariable variable=TestMatrixEntriesPerJobWindows]3"
          Write-Host "##vso[task.setvariable variable=TestMatrixEntriesPerJobMac]1"
        }
      displayName: Apply test-runtime weighted batching
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))

  - ${{ if eq(parameters.EnableLocWeighting, true) }}:
    - pwsh: |
        eng/scripts/Get-PackageLocWeights.ps1 `
          -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
          -RepoRoot "$(Build.SourcesDirectory)" `
          -OutputFile "$(Build.ArtifactStagingDirectory)/loc-weights.json"
      displayName: Count LOC per package for build/analyze weighting
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))

    - pwsh: |
        eng/scripts/Apply-WeightedBatching.ps1 `
          -PackageInfoFolder "$(Build.ArtifactStagingDirectory)/PackageInfo" `
          -WeightsFile "$(Build.ArtifactStagingDirectory)/loc-weights.json" `
          -Target ${{ parameters.LocTarget }}
      displayName: Apply LOC-weighted batching (target ${{ parameters.LocTarget }})
      condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))

parameters:
  - name: Pool
    type: object
  - name: InitializationSteps
    type: stepList
  - name: HasNugetPackages
    type: boolean

stages:
  - stage: UpdateMgmtGeneratorDependency
    displayName: Update management generator dependency
    dependsOn:
      - Build
      - Publish
    condition: and(not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(dependencies.Publish.outputs['Publish.Publish.markPublicNpm.publicNpmPublished'], 'true'))
    variables:
      emitterVersion: $[ stageDependencies.Build.Build.outputs['initialize.emitterVersion'] ]
      dependencyBranch: typespec/update-mgmt-branded-$(Build.BuildId)
      mgmtNpmrcPath: $(Agent.TempDirectory)/mgmt-dependency/.npmrc
      MgmtDependencyUpdateNeeded: 'false'
      MgmtDependencyFailed: 'false'
      ReuseExistingDependencyPR: 'false'
      HasChanges: 'false'
    pool: ${{ parameters.Pool }}
    jobs:
      - job: UpdateManagement
        condition: not(canceled())
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 1
            fetchTags: false

          # A release can finish after newer commits land. Start from current main,
          # not the old commit which produced the released package.
          - pwsh: |
              git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
              if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch main.' }
              git checkout --detach origin/main
              if ($LASTEXITCODE -ne 0) { throw 'Failed to check out main.' }
            displayName: Check out latest main
            workingDirectory: $(Build.SourcesDirectory)

          # An earlier attempt may already have pushed its branch. Reuse it as-is,
          # including its success/failure status; never overwrite maintainer edits.
          - pwsh: |
              $branch = '$(dependencyBranch)'
              $version = '$(emitterVersion)'
              $remote = git ls-remote --heads origin "refs/heads/$branch"
              if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect the existing update branch.' }
              if ($remote) {
                git fetch --no-tags --depth=1 origin "refs/heads/$branch"
                if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch the existing update branch.' }
                $subject = git log -1 --format=%s FETCH_HEAD
                if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect the existing update commit.' }
                $expected = "Update management generator branded dependency to $version"
                $failed = "Failed: Update management generator branded dependency to $version"
                if ($subject -ne $expected -and $subject -ne $failed) {
                  throw 'The existing update branch has an unexpected head; refusing to overwrite it.'
                }
                Write-Host '##vso[task.setvariable variable=ReuseExistingDependencyPR]true'
                Write-Host '##vso[task.setvariable variable=MgmtDependencyUpdateNeeded]true'
                if ($subject -eq $failed) { Write-Host '##vso[task.setvariable variable=MgmtDependencyFailed]true' }
              }
            displayName: Detect previous update attempt
            workingDirectory: $(Build.SourcesDirectory)

          - ${{ parameters.InitializationSteps }}

          - download: current
            artifact: build_artifacts
            displayName: Download branded build artifacts

          - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
            parameters:
              npmrcPath: $(mgmtNpmrcPath)

          # Record failures explicitly instead of depending on Agent.JobStatus:
          # unrelated optional steps (for example, the NuGet cache) can also warn.
          # The job is failed after a draft PR is created, if there are changes.
          - pwsh: |
              $PSNativeCommandUseErrorActionPreference = $false
              & pwsh -NoLogo -NoProfile -File '$(Build.SourcesDirectory)/eng/scripts/typespec/Update-MgmtGeneratorDependency.ps1' `
                -RepoRoot '$(Build.SourcesDirectory)' `
                -PublishedPackageJson '$(Pipeline.Workspace)/build_artifacts/lock-files/package.json' `
                -Version '$(emitterVersion)'
              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'Management dependency update failed.'
                Write-Host '##vso[task.setvariable variable=MgmtDependencyFailed]true'
                $global:LASTEXITCODE = 0
              }
            displayName: Update management dependencies
            condition: and(succeeded(), eq(variables['ReuseExistingDependencyPR'], 'false'))
            env:
              npm_config_userconfig: $(mgmtNpmrcPath)

          - ${{ if not(parameters.HasNugetPackages) }}:
            - pwsh: |
                Write-Warning 'Matching NuGet package was not published; the update requires manual repair.'
                Write-Host '##vso[task.setvariable variable=MgmtDependencyFailed]true'
              displayName: Record missing NuGet publication
              condition: and(succeeded(), eq(variables['MgmtDependencyUpdateNeeded'], 'true'), eq(variables['ReuseExistingDependencyPR'], 'false'))

          - pwsh: |
              $PSNativeCommandUseErrorActionPreference = $false
              npm ci
              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'Installing locked management dependencies failed.'
                Write-Host '##vso[task.setvariable variable=MgmtDependencyFailed]true'
                $global:LASTEXITCODE = 0
              }
            displayName: Install locked management dependencies
            condition: and(succeeded(), eq(variables['MgmtDependencyFailed'], 'false'), eq(variables['MgmtDependencyUpdateNeeded'], 'true'), eq(variables['ReuseExistingDependencyPR'], 'false'))
            workingDirectory: $(Build.SourcesDirectory)/eng/packages/http-client-csharp-mgmt
            env:
              npm_config_userconfig: $(mgmtNpmrcPath)

          - pwsh: |
              $PSNativeCommandUseErrorActionPreference = $false
              & pwsh -NoLogo -NoProfile -Command '$ErrorActionPreference = "Stop"; $global:LASTEXITCODE = 0; & $env:MGMT_GENERATE_SCRIPT; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'Management test-project regeneration failed.'
                Write-Host '##vso[task.setvariable variable=MgmtDependencyFailed]true'
                $global:LASTEXITCODE = 0
              }
            displayName: Regenerate management test projects
            condition: and(succeeded(), eq(variables['MgmtDependencyFailed'], 'false'), eq(variables['MgmtDependencyUpdateNeeded'], 'true'), eq(variables['ReuseExistingDependencyPR'], 'false'))
            env:
              MGMT_GENERATE_SCRIPT: $(Build.SourcesDirectory)/eng/packages/http-client-csharp-mgmt/eng/scripts/Generate.ps1
              npm_config_userconfig: $(mgmtNpmrcPath)

          # The branded descriptor is updated by a separate SDK regeneration PR.
          # Keep this update draft until the currently approved version permits it.
          - pwsh: |
              $PSNativeCommandUseErrorActionPreference = $false
              & pwsh -NoLogo -NoProfile -Command '$ErrorActionPreference = "Stop"; $global:LASTEXITCODE = 0; & $env:MGMT_APPROVAL_SCRIPT -RepoRoot $env:MGMT_APPROVAL_REPO -ValidateOnly; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'Management dependency approval validation failed.'
                Write-Host '##vso[task.setvariable variable=MgmtDependencyFailed]true'
                $global:LASTEXITCODE = 0
              }
            displayName: Validate approved management versions
            condition: and(succeeded(), eq(variables['MgmtDependencyFailed'], 'false'), eq(variables['MgmtDependencyUpdateNeeded'], 'true'), eq(variables['ReuseExistingDependencyPR'], 'false'))
            env:
              MGMT_APPROVAL_SCRIPT: $(Build.SourcesDirectory)/doc/GeneratorVersions/Emitter_Version_Dashboard.ps1
              MGMT_APPROVAL_REPO: $(Build.SourcesDirectory)

          # Mint the short-lived token only after the potentially long regeneration.
          - template: /eng/common/pipelines/templates/steps/login-to-github.yml
            parameters:
              TokenOwners:
                - Azure

          - pwsh: |
              if ('$(ReuseExistingDependencyPR)' -eq 'true' -and (git status --porcelain)) {
                throw 'Unexpected working tree changes while reusing an existing branch.'
              }
            displayName: Check reused branch

          # Include new generated files as well as tracked changes.
          - pwsh: |
              git add -A -- eng/packages/http-client-csharp-mgmt eng/centralpackagemanagement/Directory.Generation.Packages.props
              if ($LASTEXITCODE -ne 0) { throw 'Failed to stage generated changes.' }
            displayName: Stage management changes
            condition: and(succeeded(), eq(variables['MgmtDependencyUpdateNeeded'], 'true'), eq(variables['ReuseExistingDependencyPR'], 'false'))
            workingDirectory: $(Build.SourcesDirectory)

          - pwsh: |
              & ./eng/scripts/typespec/Push-MgmtDependencyBranch.ps1 `
                -RepoRoot '$(Build.SourcesDirectory)' -Branch '$(dependencyBranch)' `
                -Version '$(emitterVersion)' -GitUrl 'https://github.com/Azure/azure-sdk-for-net.git' `
                -Failed:('$(MgmtDependencyFailed)' -eq 'true') -AuthToken $env:GH_TOKEN
            displayName: Create update branch
            condition: and(succeeded(), eq(variables['MgmtDependencyUpdateNeeded'], 'true'), eq(variables['ReuseExistingDependencyPR'], 'false'))
            workingDirectory: $(Build.SourcesDirectory)
            env:
              GH_TOKEN: $(GH_TOKEN)

          - pwsh: |
              $failed = '$(MgmtDependencyFailed)' -eq 'true'
              $prefix = if ($failed) { 'Failed: ' } else { '' }
              $title = "${prefix}Update management generator branded dependency to $(emitterVersion)"
              $run = "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
              $body = "Update the management generator to branded C# emitter $(emitterVersion) and its matching unbranded emitter.`n`nPipeline run: $run"
              if ('${{ parameters.HasNugetPackages }}' -ne 'true') { $body += "`n`nMatching NuGet package was not published by this run." }
              if ($failed) { $body += "`n`nThis draft requires review of the run logs before it can be merged. If the branded version exceeds the approved emitter descriptor, wait for that descriptor update, update this branch from main, and rerun validation. If installation or regeneration failed, repair it and run full local management regeneration." }
              $global:LASTEXITCODE = 0
              . ./eng/common/scripts/common.ps1
              $head = 'Azure:$(dependencyBranch)'
              $existing = @(Get-GitHubPullRequests -RepoOwner Azure -RepoName azure-sdk-for-net -State all -Head $head -Base main -AuthToken $env:GH_TOKEN)
              $pr = $existing | Where-Object state -eq 'open' | Select-Object -First 1
              if (-not $pr -and ($existing | Where-Object state -eq 'closed')) {
                Write-Host 'The update PR was already closed; not creating another.'
                return
              }
              if (-not $pr) {
                try {
                  $pr = New-GitHubPullRequest -RepoOwner Azure -RepoName azure-sdk-for-net -Title $title -Head $head -Base main -Body $body -Maintainer_Can_Modify $true -Draft $failed -AuthToken $env:GH_TOKEN
                } catch {
                  # A competing attempt can create the PR after our lookup. Only
                  # suppress the failure if that exact branch now has an open PR.
                  $creationError = $_
                  $pr = @(Get-GitHubPullRequests -RepoOwner Azure -RepoName azure-sdk-for-net -State open -Head $head -Base main -AuthToken $env:GH_TOKEN) | Select-Object -First 1
                  if (-not $pr) { throw $creationError }
                }
              }
              Write-Host "Management dependency PR: $($pr.html_url)"
              Write-Host "##vso[task.setvariable variable=Submitted.PullRequest.Number]$($pr.number)"
            displayName: Create dependency update pull request
            condition: and(succeeded(), eq(variables['MgmtDependencyUpdateNeeded'], 'true'), or(eq(variables['HasChanges'], 'true'), eq(variables['ReuseExistingDependencyPR'], 'true')))
            workingDirectory: $(Build.SourcesDirectory)
            env:
              GH_TOKEN: $(GH_TOKEN)

          - pwsh: throw 'Management dependency update failed; see earlier logs and the draft PR if created.'
            displayName: Report failed update
            condition: and(succeeded(), eq(variables['MgmtDependencyFailed'], 'true'))

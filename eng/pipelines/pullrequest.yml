pr:
  branches:
    include:
    - main
    - feature/*
    - hotfix/*
    - release/*
    - sdkauto/*
  paths:
    include:
    - "*"
    exclude:
    - .github/skills/azsdk-common-*/**

parameters:
  - name: Service
    type: string
    default: auto
  - name: SkipPrValidation
    type: boolean
    default: false
  - name: UseRepositorySourceGraph
    type: boolean
    default: true
  # Switch to canary to test canary 1es branch. 1es template validation will set this parameter
  # to canary on run.
  - name: oneESTemplateTag
    type: string
    default: release
    values:
      - release
      - canary

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    oneESTemplateTag: ${{ parameters.oneESTemplateTag }}
    SkipPrValidation: ${{ parameters.SkipPrValidation }}
    # Short term hack to get 1es canary validation working until we can fix manual runs with 'auto'
    ${{ if and(eq(parameters.oneESTemplateTag, 'canary'), eq(parameters.Service, 'auto')) }}:
      ServiceDirectory: template
    ${{ else }}:
      ServiceDirectory: ${{ parameters.Service }}
    BuildSnippets: true
    EnableTestCheckoutNarrowing: true
    UseRepositorySourceGraph: ${{ parameters.UseRepositorySourceGraph }}
    # Public Microsoft-hosted jobs allow at most six hours. Keep every existing matrix leg and
    # batch alive for that full window while the sparse-worktree validation is experimental.
    TestTimeoutInMinutes: 360
    ExcludePaths:
      - eng/packages/http-client-csharp/

pr:
  branches:
    include:
    - main
    - feature/*
    - hotfix/*
    - release/*
    - sdkauto/*
  paths:
    include:
    - "*"
    exclude:
    - .github/skills/azsdk-common-*/**

parameters:
  - name: Service
    type: string
    default: auto
  - name: SkipPrValidation
    type: boolean
    default: false
  # Switch to canary to test canary 1es branch. 1es template validation will set this parameter
  # to canary on run.
  - name: oneESTemplateTag
    type: string
    default: release
    values:
      - release
      - canary

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    oneESTemplateTag: ${{ parameters.oneESTemplateTag }}
    SkipPrValidation: ${{ parameters.SkipPrValidation }}
    # Short term hack to get 1es canary validation working until we can fix manual runs with 'auto'
    ${{ if and(eq(parameters.oneESTemplateTag, 'canary'), eq(parameters.Service, 'auto')) }}:
      ServiceDirectory: template
    ${{ else }}:
      ServiceDirectory: ${{ parameters.Service }}
    BuildSnippets: true
    ExcludePaths:
      - eng/packages/http-client-csharp/
      # TEMP (draft only): this shared-infrastructure change otherwise selects
      # Azure.Core and nearly every dependent package, exceeding the dynamic YAML
      # size limit. Remove this block before marking the cache PR ready for review.
      - eng/Directory.Build.Common.targets
      - eng/service.proj
      - eng/scripts/Language-Settings.ps1
      - eng/scripts/tests/TestDependencyGraphCache.Tests.ps1
      - eng/pipelines/templates/jobs/ci.yml
      - eng/pipelines/templates/stages/archetype-sdk-client.yml
      - eng/pipelines/templates/steps/pr-matrix-presteps.yml

omitted_paths:
  - archive/*
  - common/Perf/*
  - common/Stress/*
  - doc/ApiDocGeneration/*
  - Documentation/*
  - eng/*
  - samples/*
  - sdk/*/*.Management.*/*
  - sdk/*/*/perf/*
  - sdk/*/*/stress/*
  - sdk/*/*/integration/*
  - sdk/*/*/tests/Samples/*
  - sdk/*/*/tests/samples/*
  - sdk/*/*/samples/*
  - sdk/*/samples/*
  - sdk/*/swagger/*
  - sdk/*mgmt*/*
  - sdk/resourcemanager/*
  - src/*
  - tools/*
  - sdk/**/tools/*

language: net
root_check_enabled: True

required_readme_sections:
  - "Azure (.+ client library for .NET|AI Agent Server Adapter for .*.NET)"
  - "^Getting started$":
    - Install the [Pp]ackage
    - Prerequisites
    - Authenticate the [Cc]lient
  - ^Key concepts$
  - ^Examples$
  - ^Troubleshooting$
  - ^Next steps$
  - ^Contributing$

